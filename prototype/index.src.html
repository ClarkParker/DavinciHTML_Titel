<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kinetic Typography Studio</title>
<style>
/* fonts are inlined at build time (tools/build.mjs) */
/*FONTS*/
/* =====================================================================
   KINETIC TYPOGRAPHY STUDIO — depth-first rebuild (engine + flagship look)
   Core: every frame is a PURE FUNCTION of normalized time t∈[0,1] over the
   in→hold→out timeline (the exact goToTime/seek model for Resolve). Real
   scrub + play-once. Functional controls. Self-contained (fonts base64).
   ===================================================================== */
:root{
  --bg:#0E0D0B;--surface:#16140F;--elevated:#1C1917;--panel:#141210;
  --line:rgba(235,218,176,.13);--hair:rgba(255,255,255,.07);
  --txt:#F4EFE6;--muted:#A8A096;--faint:#6E665C;
  --gold:#D4A574;--gold2:#EBDAB0;
  --disp:'Bricolage Grotesque Variable','Bricolage Grotesque',Georgia,serif;
  --sans:'Archivo Variable','Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --e:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:var(--sans);color:var(--txt)}
::selection{background:var(--gold);color:#0E0D0B}

.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

/* ---- top bar ---- */
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(20,18,14,.7),rgba(14,13,11,.2))}
.brand{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand .k{color:var(--gold)}
.pill{font-size:10px;font-weight:700;letter-spacing:.12em;color:#0E0D0B;background:var(--gold);padding:3px 8px;border-radius:999px}
.linefield{flex:1;min-width:160px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px}
.linefield .ic{color:var(--faint)}
.linefield input{flex:1;background:none;border:none;outline:none;font-size:15px;font-family:var(--disp);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;white-space:nowrap}
.btn.gold{background:var(--gold);color:#0E0D0B}.btn.gold:hover{background:var(--gold2)}
.btn.ghost{border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--gold)}

/* ---- body: stage + controls ---- */
.body{display:grid;grid-template-columns:1fr 320px;min-height:0}
.stagewrap{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:
    radial-gradient(1200px 500px at 50% -10%, #1b1610 0%, transparent 60%),
    radial-gradient(900px 600px at 90% 120%, #14120d 0%, transparent 55%),
    var(--bg);
}
/* subtle, tasteful transparency hint (NOT a loud checker) */
.stagewrap::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:linear-gradient(45deg,rgba(255,255,255,.012) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.012) 75%),
                   linear-gradient(45deg,rgba(255,255,255,.012) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.012) 75%);
  background-size:46px 46px;background-position:0 0,23px 23px}
.safe{position:absolute;inset:7%;border:1px solid rgba(255,255,255,.05);border-radius:2px;pointer-events:none;display:none}
.safe.on{display:block}
.alphatag{position:absolute;top:16px;left:18px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.alphatag b{color:var(--gold)}

/* ---- THE STAGE (where the title renders) ---- */
.scene{position:relative;text-align:center;padding:0 6%;max-width:92%}
.title{font-family:var(--disp);font-weight:700;line-height:1.04;letter-spacing:-.02em;
  font-size:clamp(30px,7vw,86px);font-variation-settings:'wght' 700;
  color:var(--txt);text-shadow:0 2px 30px rgba(0,0,0,.5)}
.title .tok{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
.accentline{height:3px;margin:22px auto 0;width:min(60%,420px);border-radius:3px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);
  transform:scaleX(0);transform-origin:50% 50%}

/* ---- controls panel ---- */
.controls{border-left:1px solid var(--hair);overflow:auto;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
.cgroup{border-bottom:1px solid var(--hair);padding:15px 16px}
.cgroup h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600}
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.field label b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:fit-content;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#0E0D0B;font-weight:600}
.seg button:hover:not(.on){border-color:var(--gold);color:var(--txt)}
select{width:100%;background:var(--elevated);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px}
input[type=range]{width:100%;accent-color:var(--gold)}
.swatches{display:flex;gap:7px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:#fff}

/* ---- transport ---- */
.transport{display:flex;align-items:center;gap:14px;padding:12px 20px;border-top:1px solid var(--hair);background:rgba(20,18,14,.5)}
.play{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;font-size:15px}
.play:hover{border-color:var(--gold);color:var(--gold)}
.scrubwrap{flex:1;display:flex;flex-direction:column;gap:5px}
.scrub{appearance:none;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--gold) var(--p,0%),var(--elevated) var(--p,0%));outline:none}
.scrub::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:var(--gold2);border:2px solid var(--bg);cursor:pointer}
.scrub::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--gold2);border:2px solid var(--bg);cursor:pointer}
.phases{display:flex;font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.phases span{position:relative}
.tc{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);min-width:88px;text-align:right;font-variant-numeric:tabular-nums}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand"><span class="k">◆</span> Kinetic Typography Studio</span>
    <span class="pill">FREE</span>
    <div class="linefield"><span class="ic">♪</span><input id="line" value="We could be heroes" spellcheck="false"></div>
    <button class="btn ghost" id="safeBtn" title="Title-safe guides">⊡</button>
    <button class="btn ghost" id="exportBtn">⬇ Export</button>
  </header>

  <div class="body">
    <div class="stagewrap" id="stagewrap">
      <div class="alphatag">Preview · <b id="lookName">Aurum</b> · transparent</div>
      <div class="safe" id="safe"></div>
      <div class="scene">
        <div class="title" id="title"></div>
        <div class="accentline" id="accent"></div>
      </div>
    </div>

    <aside class="controls">
      <div class="cgroup">
        <h4>Animation</h4>
        <div class="field"><label>In</label>
          <select id="animIn">
            <option value="maskRise">Mask Rise</option><option value="rise">Rise</option>
            <option value="fade">Fade</option><option value="pop">Pop</option>
            <option value="slide">Slide</option><option value="blurIn">Blur In</option>
          </select></div>
        <div class="field"><label>Out</label>
          <select id="animOut">
            <option value="fadeSink">Fade Sink</option><option value="fade">Fade</option>
            <option value="riseOut">Rise</option><option value="maskDown">Mask Down</option>
          </select></div>
        <div class="field"><label>Easing</label>
          <select id="ease">
            <option value="outExpo">Expo</option><option value="outCubic">Cubic</option>
            <option value="outQuint">Quint</option><option value="inOutCubic">Smooth</option>
            <option value="outBack">Back (overshoot)</option><option value="outElastic">Elastic</option>
            <option value="outBounce">Bounce</option><option value="linear">Linear</option>
          </select></div>
      </div>

      <div class="cgroup">
        <h4>Stagger</h4>
        <div class="field"><label>Unit</label>
          <div class="seg" id="unit"><button data-v="char">Char</button><button data-v="word" class="on">Word</button><button data-v="line">Line</button></div></div>
        <div class="field"><label>Order</label>
          <div class="seg" id="order"><button data-v="l2r" class="on">L→R</button><button data-v="rev">R→L</button><button data-v="center">Center</button><button data-v="random">Random</button></div></div>
        <div class="field"><label>Amount <b id="staggerV">0.60</b></label><input type="range" id="stagger" min="0" max="1" step="0.01" value="0.6"></div>
      </div>

      <div class="cgroup">
        <h4>Timing</h4>
        <div class="field"><label>In <b id="inV">0.8s</b></label><input type="range" id="inDur" min="0.2" max="2" step="0.05" value="0.8"></div>
        <div class="field"><label>Hold <b id="holdV">1.4s</b></label><input type="range" id="hold" min="0" max="3" step="0.1" value="1.4"></div>
        <div class="field"><label>Out <b id="outV">0.7s</b></label><input type="range" id="outDur" min="0.2" max="2" step="0.05" value="0.7"></div>
      </div>

      <div class="cgroup">
        <h4>Type</h4>
        <div class="field"><label>Weight <b id="weightV">700</b></label><input type="range" id="weight" min="300" max="800" step="10" value="700"></div>
        <div class="field"><label>Color</label>
          <div class="swatches" id="colors">
            <span class="sw on" style="background:#F4EFE6" data-c="#F4EFE6"></span>
            <span class="sw" style="background:#EBDAB0" data-c="#EBDAB0"></span>
            <span class="sw" style="background:#D4A574" data-c="#D4A574"></span>
            <span class="sw" style="background:#ff9ec4" data-c="#ff9ec4"></span>
            <span class="sw" style="background:#7cd4ff" data-c="#7cd4ff"></span>
          </div></div>
        <div class="field"><label>Accent underline <b id="accentToggleV">On</b></label>
          <div class="seg" id="accentToggle"><button data-v="1" class="on">On</button><button data-v="0">Off</button></div></div>
      </div>
    </aside>
  </div>

  <footer class="transport">
    <button class="play" id="play" title="Play (Space)">▶</button>
    <div class="scrubwrap">
      <input type="range" class="scrub" id="scrub" min="0" max="1000" value="180">
      <div class="phases"><span style="flex:0 0 var(--inpc,27%)">in</span><span style="flex:1">hold</span><span style="flex:0 0 var(--outpc,23%);text-align:right">out</span></div>
    </div>
    <span class="tc" id="tc">0.54s / 2.90s</span>
    <span class="badge" id="badge">1080p · 30fps · alpha</span>
  </footer>
</div>

<script>
"use strict";
/* ===================== easings (standard formulas — easings.net) ===================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const EASE={
  linear:t=>t,
  outCubic:t=>1-Math.pow(1-t,3),
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outQuint:t=>1-Math.pow(1-t,5),
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  outBack:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  outElastic:t=>{const c4=2*Math.PI/3;return t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*c4)+1;},
  outBounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;}
};
/* entrance/exit animators: progress p∈[0,1] → partial style (transforms in em) */
const IN={
  maskRise:p=>({clip:p, ty:(1-p)*0.45}),
  rise:p=>({ty:(1-p)*0.85, o:p}),
  fade:p=>({o:p}),
  pop:p=>({sc:0.7+0.3*p, o:p}),
  slide:p=>({tx:(1-p)*-1.0, o:p}),
  blurIn:p=>({o:p, blur:(1-p)*9})
};
const OUT={
  fadeSink:p=>({o:1-p, ty:p*0.45}),
  fade:p=>({o:1-p}),
  riseOut:p=>({o:1-p, ty:-p*0.45}),
  maskDown:p=>({clip:1-p})
};

/* ===================== state ===================== */
const state={
  line:"We could be heroes", unit:"word", order:"l2r",
  animIn:"maskRise", animOut:"fadeSink", ease:"outExpo",
  stagger:0.6, inDur:0.8, hold:1.4, outDur:0.7,
  weight:700, color:"#F4EFE6", accent:true
};
let t=0.18, playing=false, rafId=0, lastTs=0;
let tokens=[]; // {el}

const $=id=>document.getElementById(id);
const dur=()=>state.inDur+state.hold+state.outDur;

/* ===================== tokenize ===================== */
function tokenize(){
  const title=$("title"); title.innerHTML=""; tokens=[];
  const line=state.line.length?state.line:" ";
  let units=[];
  if(state.unit==="char") units=[...line].map(c=>c);
  else if(state.unit==="word"){ // keep spaces attached so layout is natural
    units=line.split(/(\s+)/).filter(s=>s.length);
  } else units=[line];
  units.forEach(u=>{
    const sp=document.createElement("span"); sp.className="tok"; sp.textContent=u===" "?" ":u;
    // spaces themselves shouldn't be animated tokens for word/char → mark
    if(/^\s+$/.test(u)){ sp.dataset.space="1"; }
    title.appendChild(sp); tokens.push(sp);
  });
}
function animTokens(){ return tokens.filter(el=>!el.dataset.space); }

/* order → normalized position 0..1 (who goes first) */
function orderNorm(i,total){
  if(total<=1) return 0;
  const n=i/(total-1);
  switch(state.order){
    case "rev": return 1-n;
    case "center": return Math.abs(n-0.5)*2;          // center first
    case "random": { const s=Math.sin((i+1)*12.9898)*43758.5453; return s-Math.floor(s); }
    default: return n;                                 // l2r
  }
}

/* ===================== the core: render one frame at normalized time t ===================== */
function renderFrame(){
  const D=dur(), timeSec=t*D;
  const ease=EASE[state.ease]||EASE.outExpo;
  const inA=IN[state.animIn]||IN.rise, outA=OUT[state.animOut]||OUT.fade;
  const list=animTokens(), N=list.length;
  const stag=state.stagger;
  const tokIn=Math.max(0.0001, state.inDur*(1-0.82*stag)), spreadIn=state.inDur-tokIn;
  const outStart=state.inDur+state.hold;
  const tokOut=Math.max(0.0001, state.outDur*(1-0.82*stag)), spreadOut=state.outDur-tokOut;

  let entranceAvg=0;
  list.forEach((el,i)=>{
    const on=orderNorm(i,N);
    const pIn=ease(clamp((timeSec-on*spreadIn)/tokIn,0,1));
    const pOut=ease(clamp((timeSec-outStart-on*spreadOut)/tokOut,0,1));
    entranceAvg += pIn*(1-pOut);
    const a=inA(pIn), b=pOut>0?outA(pOut):null;
    let tx=a.tx||0, ty=a.ty||0, sc=a.sc==null?1:a.sc, o=a.o==null?1:a.o, blur=a.blur||0, clip=a.clip;
    if(b){ o*=(b.o==null?1:b.o); ty+=b.ty||0; tx+=b.tx||0; sc*=(b.sc==null?1:b.sc); blur+=b.blur||0; if(b.clip!=null)clip=b.clip; }
    el.style.transform=`translate(${tx}em,${ty}em) scale(${sc})`;
    el.style.opacity=o;
    el.style.filter=blur>0.01?`blur(${blur}px)`:"";
    el.style.clipPath=clip!=null?`inset(${(1-clip)*100}% 0 0 0)`:"";
  });
  // accent underline draws with overall entrance progress
  const prog=N?entranceAvg/N:0;
  $("accent").style.transform=`scaleX(${state.accent?prog:0})`;
  // transport UI
  $("scrub").style.setProperty("--p",(t*100).toFixed(1)+"%");
  $("tc").textContent=timeSec.toFixed(2)+"s / "+D.toFixed(2)+"s";
}

/* ===================== look (style) ===================== */
function applyLook(){
  const title=$("title");
  title.style.setProperty("font-variation-settings",`'wght' ${state.weight}`);
  title.style.color=state.color;
}

/* ===================== rebuild + render ===================== */
function rebuild(){ tokenize(); applyLook(); renderFrame(); updatePhaseBar(); }
function updatePhaseBar(){ const D=dur();
  document.querySelector(".phases").style.setProperty("--inpc",(state.inDur/D*100).toFixed(1)+"%");
  document.querySelector(".phases").style.setProperty("--outpc",(state.outDur/D*100).toFixed(1)+"%"); }

/* ===================== playback (play once: in→hold→out) ===================== */
function play(){
  if(playing){ stop(); return; }
  playing=true; $("play").textContent="❚❚";
  if(t>=0.999) t=0;
  lastTs=performance.now();
  const step=ts=>{
    if(!playing)return;
    const dt=(ts-lastTs)/1000; lastTs=ts;
    t=clamp(t+dt/dur(),0,1); $("scrub").value=Math.round(t*1000); renderFrame();
    if(t>=1){ stop(); return; }
    rafId=requestAnimationFrame(step);
  };
  rafId=requestAnimationFrame(step);
}
function stop(){ playing=false; cancelAnimationFrame(rafId); $("play").textContent="▶"; }

/* ===================== wiring ===================== */
function bind(){
  $("line").addEventListener("input",e=>{state.line=e.target.value;rebuild();});
  $("animIn").addEventListener("change",e=>{state.animIn=e.target.value;renderFrame();});
  $("animOut").addEventListener("change",e=>{state.animOut=e.target.value;renderFrame();});
  $("ease").addEventListener("change",e=>{state.ease=e.target.value;renderFrame();});
  $("stagger").addEventListener("input",e=>{state.stagger=+e.target.value;$("staggerV").textContent=state.stagger.toFixed(2);renderFrame();});
  $("inDur").addEventListener("input",e=>{state.inDur=+e.target.value;$("inV").textContent=state.inDur.toFixed(2)+"s";rebuild();});
  $("hold").addEventListener("input",e=>{state.hold=+e.target.value;$("holdV").textContent=state.hold.toFixed(1)+"s";rebuild();});
  $("outDur").addEventListener("input",e=>{state.outDur=+e.target.value;$("outV").textContent=state.outDur.toFixed(2)+"s";rebuild();});
  $("weight").addEventListener("input",e=>{state.weight=+e.target.value;$("weightV").textContent=state.weight;applyLook();});
  segGroup("unit",v=>{state.unit=v;rebuild();});
  segGroup("order",v=>{state.order=v;renderFrame();});
  segGroup("accentToggle",v=>{state.accent=v==="1";$("accentToggleV").textContent=state.accent?"On":"Off";renderFrame();});
  $("colors").addEventListener("click",e=>{const s=e.target.closest(".sw");if(!s)return;
    [...$("colors").children].forEach(x=>x.classList.remove("on"));s.classList.add("on");state.color=s.dataset.c;applyLook();});
  $("scrub").addEventListener("input",e=>{stop();t=+e.target.value/1000;renderFrame();});
  $("play").addEventListener("click",play);
  $("safeBtn").addEventListener("click",()=>$("safe").classList.toggle("on"));
  $("exportBtn").addEventListener("click",()=>{}); // wired in a later increment
  addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();play();}});
}
function segGroup(id,cb){const g=$(id);g.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  [...g.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");cb(b.dataset.v);});}

/* ===================== init (+ ?frame= for QA screenshots) ===================== */
function init(){
  bind();
  const p=new URLSearchParams(location.search);
  if(p.has("line")){state.line=p.get("line");$("line").value=state.line;}
  if(p.has("frame")){t=clamp(parseFloat(p.get("frame"))||0,0,1);$("scrub").value=Math.round(t*1000);}
  rebuild();
}
document.fonts&&document.fonts.ready?document.fonts.ready.then(init):init();
</script>
</body>
</html>
