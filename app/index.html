<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kinetic Typography Studio</title>
<style>
  :root{
    --bg:#0E0D0B; --surface:#16140F; --elevated:#1C1917; --panel:#141210;
    --hair:rgba(255,255,255,.07); --line:rgba(235,218,176,.13);
    --txt:#F4EFE6; --muted:#A8A096; --faint:#6E665C; --gold:#D4A574; --gold2:#EBDAB0;
    --disp:"Bricolage Grotesque","Georgia",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select{font-family:var(--sans);color:var(--txt)}
  ::selection{background:var(--gold);color:#0E0D0B}
  /* themed scrollbars */
  *{scrollbar-width:thin;scrollbar-color:rgba(212,165,116,.4) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(212,165,116,.30);border-radius:999px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(212,165,116,.55);background-clip:content-box}
  ::-webkit-scrollbar-corner{background:transparent}

  /* Stable shell: never grows "wild" — fixed side rails, the stage scales WITHIN
     its box (container units), everything else scrolls. Works small (DaVinci panel)
     to large. min-0 stops grid blow-ups. */
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-width:760px;overflow:hidden}
  .body{display:grid;grid-template-columns:226px minmax(0,1fr) 290px;min-height:0;min-width:0}
  .lib,.center,.controls{min-width:0;min-height:0}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--hair);
    background:linear-gradient(180deg,rgba(20,18,14,.7),rgba(14,13,11,.15))}
  .brand{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .brand .k{color:var(--gold)}
  .pill{font-size:9px;font-weight:700;letter-spacing:.14em;color:#0E0D0B;background:var(--gold);padding:3px 7px;border-radius:999px}
  .linefield{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .linefield .ic{color:var(--faint)}
  .linefield input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:15px;font-family:var(--disp);font-weight:600}
  .seg{display:flex;gap:4px}
  .seg button{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);white-space:nowrap}
  .seg button.on{background:var(--gold);border-color:var(--gold);color:#0E0D0B;font-weight:600}
  .seg button:hover:not(.on){border-color:var(--gold);color:var(--txt)}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;padding:9px 13px;border-radius:9px;white-space:nowrap}
  .btn.gold{background:var(--gold);color:#0E0D0B}.btn.gold:hover{background:var(--gold2)}
  .btn.ghost{border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--gold)}

  /* ---------- library ---------- */
  .lib{border-right:1px solid var(--hair);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.012),transparent)}
  .libhead{display:flex;align-items:center;justify-content:space-between}
  .libhead h4{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .libhead button{font-size:11px;color:var(--gold)}
  .vcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--surface);transition:border-color .15s;flex:0 0 auto}
  .vcard:hover{border-color:rgba(235,218,176,.4)}
  .vcard.on{border-color:var(--gold)}
  .vstage{position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(420px 200px at 50% -20%,#1b1610,transparent 70%),var(--bg)}
  .vtitle{font-family:var(--disp);font-weight:700;text-align:center;line-height:1.02;letter-spacing:-.02em;font-size:15px;padding:0 8%}
  .vtitle .tok{display:inline-block;white-space:pre}
  .vmeta{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:11px;color:var(--muted)}
  .vmeta .fav{font-size:13px;color:var(--faint)}.vmeta .fav.on{color:var(--gold)}

  /* ---------- stage ---------- */
  .center{display:grid;grid-template-rows:minmax(0,1fr) auto}
  .stagewrap{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:22px;min-height:0;
    background:radial-gradient(1200px 500px at 50% -10%,#1b1610 0,transparent 60%),
               radial-gradient(900px 600px at 90% 120%,#14120d 0,transparent 55%),var(--bg)}
  .stage{position:relative;container-type:size;aspect-ratio:16/9;
    width:min(100%,calc((100vh - 220px)*16/9));max-width:100%;max-height:100%;
    display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--hair);border-radius:8px}
  .stage[data-aspect="9:16"]{aspect-ratio:9/16;width:min(100%,calc((100vh - 220px)*9/16))}
  .stage[data-aspect="1:1"]{aspect-ratio:1/1;width:min(100%,calc(100vh - 220px))}
  .stage::before{content:"";position:absolute;inset:0;opacity:.6;pointer-events:none;
    background-image:linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%),
                     linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%);
    background-size:42px 42px;background-position:0 0,21px 21px}
  .alphatag{position:absolute;top:13px;left:15px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);z-index:2}
  .alphatag b{color:var(--gold)}
  .scene{position:relative;text-align:center;padding:0 6%;max-width:92%}
  .title{font-family:var(--disp);font-weight:700;line-height:1.04;letter-spacing:-.02em;
    font-size:clamp(20px,8.2cqw,108px);color:var(--txt);text-shadow:0 2px 30px rgba(0,0,0,.5)}
  .title .tok{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
  .accent{height:3px;margin:3.2cqh auto 0;width:min(58%,420px);border-radius:3px;transform:scaleX(0);transform-origin:50% 50%;
    background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent)}

  /* ---------- transport ---------- */
  .transport{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--hair);background:rgba(20,18,14,.5)}
  .play{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;flex:0 0 auto}
  .play:hover{border-color:var(--gold);color:var(--gold)}
  .scrub{flex:1;min-width:0;appearance:none;height:6px;border-radius:999px;outline:none;
    background:linear-gradient(90deg,var(--gold) var(--p,50%),var(--elevated) var(--p,50%))}
  .scrub::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:var(--gold2);border:2px solid var(--bg);cursor:pointer}
  .tc{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
  .badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}

  /* ---------- controls ---------- */
  .controls{border-left:1px solid var(--hair);overflow:auto;background:linear-gradient(180deg,rgba(255,255,255,.012),transparent)}
  .cgroup{border-bottom:1px solid var(--hair);padding:13px 14px}
  .cgroup h4{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;font-weight:600}
  .field{margin-bottom:12px}.field:last-child{margin-bottom:0}
  .field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field label b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  .seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1;min-width:fit-content}
  select{width:100%;background:var(--elevated);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px}
  input[type=range]{width:100%;accent-color:var(--gold)}
  .swatches{display:flex;gap:7px}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:#fff}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--elevated);
    border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:12.5px;color:var(--txt);
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand"><span class="k">◆</span> Kinetic Typography Studio</span>
    <span class="pill">FREE</span>
    <div class="linefield"><span class="ic">♪</span>
      <input id="line" value="WE OWN THE NIGHT" spellcheck="false" autocomplete="off"></div>
    <div class="seg" id="aspect">
      <button data-v="16:9" class="on">16:9</button><button data-v="9:16">9:16</button><button data-v="1:1">1:1</button>
    </div>
    <button class="btn ghost" id="generate" title="New variants">🎲 Generate</button>
    <button class="btn gold" id="export">⬇ Export</button>
  </header>

  <div class="body">
    <aside class="lib">
      <div class="libhead"><h4>Variants</h4><button id="more">＋ more</button></div>
      <div id="cards"></div>
    </aside>

    <section class="center">
      <div class="stagewrap">
        <div class="stage" id="stage" data-aspect="16:9">
          <div class="alphatag">Preview · <b id="lookName">Aurum</b> · transparent</div>
          <div class="scene"><div class="title" id="title"></div><div class="accent" id="accent"></div></div>
        </div>
      </div>
      <footer class="transport">
        <button class="play" id="play" title="Play (Space)">▶</button>
        <input type="range" class="scrub" id="scrub" min="0" max="1000" value="500">
        <span class="tc" id="tc">0.00s / 0.00s</span>
        <span class="badge" id="badge">1920×1080 · 30fps · alpha</span>
      </footer>
    </section>

    <aside class="controls">
      <div class="cgroup"><h4>Animation</h4>
        <div class="field"><label>In</label>
          <select id="animIn">
            <option value="maskRise">Mask Rise</option><option value="rise">Rise</option>
            <option value="fade">Fade</option><option value="pop">Pop</option>
            <option value="slide">Slide</option><option value="blurIn">Blur In</option></select></div>
        <div class="field"><label>Out</label>
          <select id="animOut">
            <option value="fadeSink">Fade Sink</option><option value="fade">Fade</option>
            <option value="riseOut">Rise</option><option value="maskDown">Mask Down</option></select></div>
        <div class="field"><label>Easing</label>
          <select id="ease">
            <option value="outExpo">Expo</option><option value="outCubic">Cubic</option>
            <option value="outQuint">Quint</option><option value="inOutCubic">Smooth</option>
            <option value="outBack">Back</option><option value="outElastic">Elastic</option>
            <option value="outBounce">Bounce</option><option value="linear">Linear</option></select></div>
      </div>
      <div class="cgroup"><h4>Stagger</h4>
        <div class="field"><label>Unit</label>
          <div class="seg wrap" id="unit"><button data-v="char">Char</button><button data-v="word" class="on">Word</button><button data-v="line">Line</button></div></div>
        <div class="field"><label>Order</label>
          <div class="seg wrap" id="order"><button data-v="l2r" class="on">L→R</button><button data-v="rev">R→L</button><button data-v="center">Center</button><button data-v="random">Random</button></div></div>
        <div class="field"><label>Amount <b id="staggerV">0.60</b></label><input type="range" id="stagger" min="0" max="1" step="0.01" value="0.6"></div>
      </div>
      <div class="cgroup"><h4>Timing</h4>
        <div class="field"><label>In <b id="inV">0.80s</b></label><input type="range" id="inDur" min="0.2" max="2" step="0.05" value="0.8"></div>
        <div class="field"><label>Hold <b id="holdV">1.4s</b></label><input type="range" id="hold" min="0" max="3" step="0.1" value="1.4"></div>
        <div class="field"><label>Out <b id="outV">0.70s</b></label><input type="range" id="outDur" min="0.2" max="2" step="0.05" value="0.7"></div>
      </div>
      <div class="cgroup"><h4>Type</h4>
        <div class="field"><label>Weight <b id="weightV">700</b></label><input type="range" id="weight" min="300" max="800" step="10" value="700"></div>
        <div class="field"><label>Color</label>
          <div class="swatches" id="colors">
            <span class="sw on" style="background:#F4EFE6" data-c="#F4EFE6"></span>
            <span class="sw" style="background:#EBDAB0" data-c="#EBDAB0"></span>
            <span class="sw" style="background:#D4A574" data-c="#D4A574"></span>
            <span class="sw" style="background:#ff9ec4" data-c="#ff9ec4"></span>
            <span class="sw" style="background:#7cd4ff" data-c="#7cd4ff"></span></div></div>
        <div class="field"><label>Accent line <b id="accentV">On</b></label>
          <div class="seg wrap" id="accentToggle"><button data-v="1" class="on">On</button><button data-v="0">Off</button></div></div>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ====== inlined engine — DO NOT EDIT HERE; edit engine/*.mjs then run tools/build-app.mjs ====== */
/* engine/engine.mjs — Kinetic Typography Studio · deterministic core (Phase 0)
 *
 * Pillar 1 — every frame is a PURE FUNCTION of normalized time t∈[0,1] over an
 *            in→hold→out timeline (the goToTime/seek model Resolve requires).
 * Pillar 2 — sampleFrame() returns pure per-token data; ANY renderer (DOM today,
 *            WebGL/MSDF field later) consumes the same frame shape. No DOM here.
 * Pillar 3 — a Seed encodes the whole look (encodeSeed/decodeSeed) → shareable URL.
 * Pillar 4 — aspect-aware, resolution-independent stage (ASPECTS).
 *
 * No dependencies, no DOM, no globals. Determinism rules: pure f(t), seeded RNG only.
 */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/* ---- easing library (standard formulas — easings.net) ---- */
const EASE = {
  linear:     t => t,
  outCubic:   t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outQuint:   t => 1 - Math.pow(1 - t, 5),
  outExpo:    t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  outBack:    t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => { const c4 = 2 * Math.PI / 3; return t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * c4) + 1; },
  outBounce:  t => { const n = 7.5625, d = 2.75; if (t < 1/d) return n*t*t; if (t < 2/d) return n*(t-=1.5/d)*t+.75; if (t < 2.5/d) return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375; },
};

/* ---- entrance / exit animators: progress p∈[0,1] → partial style (transforms in em) ---- */
const IN = {
  maskRise: p => ({ clip: p, ty: (1 - p) * 0.45 }),
  rise:     p => ({ ty: (1 - p) * 0.85, o: p }),
  fade:     p => ({ o: p }),
  pop:      p => ({ sc: 0.7 + 0.3 * p, o: p }),
  slide:    p => ({ tx: (1 - p) * -1.0, o: p }),
  blurIn:   p => ({ o: p, blur: (1 - p) * 9 }),
};
const OUT = {
  fadeSink: p => ({ o: 1 - p, ty: p * 0.45 }),
  fade:     p => ({ o: 1 - p }),
  riseOut:  p => ({ o: 1 - p, ty: -p * 0.45 }),
  maskDown: p => ({ clip: 1 - p }),
};

/* ---- Pillar 4: resolution-independent stage ---- */
const ASPECTS = { "16:9": [1920, 1080], "9:16": [1080, 1920], "1:1": [1080, 1080] };

const DEFAULT_STATE = {
  line: "WE OWN THE NIGHT",
  unit: "word", order: "l2r",
  animIn: "maskRise", animOut: "fadeSink", ease: "outExpo",
  stagger: 0.6, inDur: 0.8, hold: 1.4, outDur: 0.7,
  weight: 700, color: "#F4EFE6", accent: true,
  aspect: "16:9",
};

const duration = s => s.inDur + s.hold + s.outDur;

/* ---- tokenize: line → [{ text, isSpace, animIndex }] (spaces keep layout, not animated) ---- */
function tokenize(line, unit) {
  const text = line && line.length ? line : " ";
  let units;
  if (unit === "char") units = [...text];
  else if (unit === "word") units = text.split(/(\s+)/).filter(s => s.length);
  else units = [text];
  let a = 0;
  return units.map(u => {
    const isSpace = /^\s+$/.test(u);
    return { text: u, isSpace, animIndex: isSpace ? -1 : a++ };
  });
}
const animCount = toks => toks.reduce((n, t) => n + (t.isSpace ? 0 : 1), 0);

/* order → who-goes-first, normalized 0..1 (deterministic, incl. seeded "random") */
function orderNorm(order, i, total) {
  if (total <= 1) return 0;
  const n = i / (total - 1);
  switch (order) {
    case "rev":    return 1 - n;
    case "center": return Math.abs(n - 0.5) * 2;
    case "random": { const s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
    default:       return n; // l2r
  }
}

/* =========================================================================
 * THE CORE — pure. state + t∈[0,1] → frame data. No DOM, no side effects.
 * Returns { dur, timeSec, accent, tokens:[{text,isSpace,tx,ty,sc,o,blur,clip}] }
 * ========================================================================= */
function sampleFrame(state, t) {
  const s = state, D = duration(s), timeSec = clamp(t, 0, 1) * D;
  const ease = EASE[s.ease] || EASE.outExpo;
  const inA = IN[s.animIn] || IN.rise, outA = OUT[s.animOut] || OUT.fade;
  const toks = tokenize(s.line, s.unit);
  const N = animCount(toks);
  const stag = s.stagger;
  const tokIn  = Math.max(1e-4, s.inDur  * (1 - 0.82 * stag)), spreadIn  = s.inDur  - tokIn;
  const outStart = s.inDur + s.hold;
  const tokOut = Math.max(1e-4, s.outDur * (1 - 0.82 * stag)), spreadOut = s.outDur - tokOut;

  let entranceSum = 0;
  const tokens = toks.map(tok => {
    if (tok.isSpace) return { text: tok.text, isSpace: true, tx: 0, ty: 0, sc: 1, o: 1, blur: 0, clip: null };
    const on = orderNorm(s.order, tok.animIndex, N);
    const pIn  = ease(clamp((timeSec - on * spreadIn) / tokIn, 0, 1));
    const pOut = ease(clamp((timeSec - outStart - on * spreadOut) / tokOut, 0, 1));
    entranceSum += pIn * (1 - pOut);
    const a = inA(pIn), b = pOut > 0 ? outA(pOut) : null;
    let tx = a.tx || 0, ty = a.ty || 0, sc = a.sc == null ? 1 : a.sc,
        o = a.o == null ? 1 : a.o, blur = a.blur || 0, clip = a.clip == null ? null : a.clip;
    if (b) {
      o *= (b.o == null ? 1 : b.o); ty += b.ty || 0; tx += b.tx || 0;
      sc *= (b.sc == null ? 1 : b.sc); blur += b.blur || 0;
      if (b.clip != null) clip = b.clip;
    }
    return { text: tok.text, isSpace: false, tx, ty, sc, o, blur, clip };
  });

  return { dur: D, timeSec, tokens, accent: s.accent ? (N ? entranceSum / N : 0) : 0 };
}

/* ---- Pillar 3: Seed = the whole look ↔ a compact, shareable string ---- */
const SEED_KEYS = ["line","unit","order","animIn","animOut","ease","stagger","inDur","hold","outDur","weight","color","accent","aspect"];
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const ub64 = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
function encodeSeed(state) {
  const o = {}; SEED_KEYS.forEach(k => (o[k] = state[k]));
  return "KT1-" + b64u(JSON.stringify(o));
}
function decodeSeed(seed) {
  try {
    const raw = String(seed).startsWith("KT1-") ? String(seed).slice(4) : String(seed);
    return { ...DEFAULT_STATE, ...JSON.parse(ub64(raw)) };
  } catch (_) { return { ...DEFAULT_STATE }; }
}

/* ---- deterministic variant from a number (preview of Phase-1 "surprise me") ---- */
const PALETTE = ["#F4EFE6", "#EBDAB0", "#D4A574", "#ff9ec4", "#7cd4ff"];
const INS = ["maskRise","rise","fade","pop","slide","blurIn"], OUTS = ["fadeSink","fade","riseOut","maskDown"],
      EASES = ["outExpo","outCubic","outQuint","outBack","inOutCubic"], ORDERS = ["l2r","rev","center","random"], UNITS = ["char","word","line"];
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let z = s; z = Math.imul(z ^ z >>> 15, z | 1); z ^= z + Math.imul(z ^ z >>> 7, z | 61); return ((z ^ z >>> 14) >>> 0) / 4294967296; }; }
function variantFromSeed(n, line) {
  const r = rng((n + 1) * 2654435761), pick = a => a[Math.floor(r() * a.length)];
  return {
    ...DEFAULT_STATE, line: line ?? DEFAULT_STATE.line,
    unit: pick(UNITS), order: pick(ORDERS), animIn: pick(INS), animOut: pick(OUTS), ease: pick(EASES),
    stagger: +(0.2 + r() * 0.7).toFixed(2), inDur: +(0.5 + r() * 0.7).toFixed(2),
    hold: +(1 + r() * 1.5).toFixed(1), outDur: +(0.5 + r() * 0.6).toFixed(2),
    weight: 400 + Math.floor(r() * 5) * 100, color: pick(PALETTE), accent: r() > 0.35,
  };
}

/* engine/dom-renderer.mjs — DOM/CSS render target (Tier A: runs in any Resolve OGraf CEF).
 *
 * Consumes the pure frame from sampleFrame(). A future WebGL/MSDF renderer implements
 * the same call shape — render(state, t) — so the engine never changes when the
 * render target does. This is Pillar 2 (one field/frame → many renderers) in practice.
 */


function createDomRenderer(titleEl, accentEl) {
  let signature = "";

  function ensureTokens(state) {
    const sig = state.line + "|" + state.unit;
    if (sig === signature) return;
    signature = sig;
    titleEl.innerHTML = "";
    tokenize(state.line, state.unit).forEach(tok => {
      const sp = document.createElement("span");
      sp.className = "tok";
      sp.textContent = tok.text === " " ? " " : tok.text;
      if (tok.isSpace) sp.dataset.space = "1";
      titleEl.appendChild(sp);
    });
  }

  function applyLook(state) {
    titleEl.style.fontWeight = String(state.weight);
    titleEl.style.setProperty("font-variation-settings", `'wght' ${state.weight}`);
    titleEl.style.color = state.color;
  }

  function render(state, t) {
    ensureTokens(state);
    applyLook(state);
    const f = sampleFrame(state, t);
    const spans = titleEl.children;
    for (let i = 0; i < f.tokens.length; i++) {
      const tk = f.tokens[i], el = spans[i];
      if (!el) continue;
      el.style.transform = `translate(${tk.tx}em, ${tk.ty}em) scale(${tk.sc})`;
      el.style.opacity = tk.o;
      el.style.filter = tk.blur > 0.01 ? `blur(${tk.blur}px)` : "";
      el.style.clipPath = tk.clip != null ? `inset(${((1 - tk.clip) * 100).toFixed(2)}% 0 0 0)` : "";
    }
    if (accentEl) accentEl.style.transform = `scaleX(${f.accent.toFixed(4)})`;
    return f;
  }

  return { render, invalidate: () => { signature = ""; } };
}

/* ====== app ====== */



  const $ = id => document.getElementById(id);
  let state = { ...DEFAULT_STATE };
  let t = 0.5, playing = false, raf = 0, last = 0;
  let genBase = 1, favorites = new Set();
  const stageR = createDomRenderer($("title"), $("accent"));

  function draw(){
    $("stage").dataset.aspect = state.aspect;
    const f = stageR.render(state, t);
    $("scrub").value = Math.round(t*1000);
    $("scrub").style.setProperty("--p",(t*100).toFixed(1)+"%");
    $("tc").textContent = f.timeSec.toFixed(2)+"s / "+f.dur.toFixed(2)+"s";
    const res = {"16:9":"1920×1080","9:16":"1080×1920","1:1":"1080×1080"}[state.aspect];
    $("badge").textContent = res+" · 30fps · alpha";
  }
  function stop(){ playing=false; cancelAnimationFrame(raf); $("play").textContent="▶"; }
  function play(){
    if(playing) return stop();
    playing=true; $("play").textContent="❚❚"; if(t>=0.999) t=0; last=performance.now();
    const step=ts=>{ if(!playing)return; t=clamp(t+(ts-last)/1000/duration(state),0,1); last=ts; draw();
      if(t>=1) return stop(); raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step);
  }

  function buildCards(){
    const host = $("cards"); host.innerHTML="";
    for(let i=0;i<9;i++){
      const k = genBase*9+i, v = variantFromSeed(k, state.line);
      const card = document.createElement("div");
      card.className="vcard"; card.dataset.i=i;
      card.innerHTML = `<div class="vstage"><div class="vtitle"></div></div>
        <div class="vmeta"><span class="vname">Seed ${k}</span>
        <button class="fav ${favorites.has(k)?'on':''}">${favorites.has(k)?'♥':'♡'}</button></div>`;
      createDomRenderer(card.querySelector(".vtitle"), null).render(v, 0.5);
      card.addEventListener("click", e=>{
        if(e.target.closest(".fav")){ favorites.has(k)?favorites.delete(k):favorites.add(k); buildCards(); return; }
        state = { ...v }; syncControls(); draw(); markActive(i);
      });
      host.appendChild(card);
    }
  }
  function markActive(i){ [...$("cards").children].forEach((c,j)=>c.classList.toggle("on", j===i)); }

  function setSeg(id,v){ [...$(id).children].forEach(b=>b.classList.toggle("on", b.dataset.v===String(v))); }
  function syncControls(){
    $("animIn").value=state.animIn; $("animOut").value=state.animOut; $("ease").value=state.ease;
    setSeg("unit",state.unit); setSeg("order",state.order); setSeg("aspect",state.aspect);
    setSeg("accentToggle", state.accent?"1":"0"); $("accentV").textContent=state.accent?"On":"Off";
    $("stagger").value=state.stagger; $("staggerV").textContent=(+state.stagger).toFixed(2);
    $("inDur").value=state.inDur;   $("inV").textContent=(+state.inDur).toFixed(2)+"s";
    $("hold").value=state.hold;     $("holdV").textContent=(+state.hold).toFixed(1)+"s";
    $("outDur").value=state.outDur; $("outV").textContent=(+state.outDur).toFixed(2)+"s";
    $("weight").value=state.weight; $("weightV").textContent=state.weight;
    [...$("colors").children].forEach(s=>s.classList.toggle("on", s.dataset.c===state.color));
  }

  let toastT=0;
  function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }

  function seg(id,cb){ $(id).addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
    [...$(id).children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); cb(b.dataset.v); }); }

  $("line").addEventListener("input",e=>{ state.line=e.target.value; draw(); buildCards(); });
  seg("aspect",v=>{ state.aspect=v; draw(); });
  $("animIn").addEventListener("change",e=>{ state.animIn=e.target.value; draw(); });
  $("animOut").addEventListener("change",e=>{ state.animOut=e.target.value; draw(); });
  $("ease").addEventListener("change",e=>{ state.ease=e.target.value; draw(); });
  seg("unit",v=>{ state.unit=v; draw(); });
  seg("order",v=>{ state.order=v; draw(); });
  seg("accentToggle",v=>{ state.accent=v==="1"; $("accentV").textContent=state.accent?"On":"Off"; draw(); });
  $("stagger").addEventListener("input",e=>{ state.stagger=+e.target.value; $("staggerV").textContent=state.stagger.toFixed(2); draw(); });
  $("inDur").addEventListener("input",e=>{ state.inDur=+e.target.value; $("inV").textContent=state.inDur.toFixed(2)+"s"; draw(); });
  $("hold").addEventListener("input",e=>{ state.hold=+e.target.value; $("holdV").textContent=state.hold.toFixed(1)+"s"; draw(); });
  $("outDur").addEventListener("input",e=>{ state.outDur=+e.target.value; $("outV").textContent=state.outDur.toFixed(2)+"s"; draw(); });
  $("weight").addEventListener("input",e=>{ state.weight=+e.target.value; $("weightV").textContent=state.weight; draw(); });
  $("colors").addEventListener("click",e=>{ const s=e.target.closest(".sw"); if(!s)return;
    [...$("colors").children].forEach(x=>x.classList.remove("on")); s.classList.add("on"); state.color=s.dataset.c; draw(); });
  $("scrub").addEventListener("input",e=>{ stop(); t=+e.target.value/1000; draw(); });
  $("play").addEventListener("click",play);
  $("generate").addEventListener("click",()=>{ genBase=Math.floor(Math.random()*100000)+1; buildCards(); toast("9 neue Varianten · Seed-Basis "+genBase); });
  $("more").addEventListener("click",()=>{ genBase++; buildCards(); });
  $("export").addEventListener("click",()=>toast("Export (PNG-Seq · WebM-Alpha · OGraf) — kommt als Nächstes."));
  addEventListener("keydown",e=>{ if(e.code==="Space"&&e.target.tagName!=="INPUT"){ e.preventDefault(); play(); } });

  function init(){ buildCards(); draw(); window.__ready=true; }
  document.fonts&&document.fonts.ready ? document.fonts.ready.then(init) : init();
</script>
