<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kinetic Typography Studio</title>
<style>
  :root{
    --bg:#0E0D0B; --surface:#16140F; --elevated:#1C1917; --panel:#141210;
    --hair:rgba(255,255,255,.07); --line:rgba(235,218,176,.13);
    --txt:#F4EFE6; --muted:#A8A096; --faint:#6E665C; --gold:#D4A574; --gold2:#EBDAB0;
    --disp:"Bricolage Grotesque","Georgia",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select{font-family:var(--sans);color:var(--txt)}
  ::selection{background:var(--gold);color:#0E0D0B}
  /* themed scrollbars */
  *{scrollbar-width:thin;scrollbar-color:rgba(212,165,116,.4) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(212,165,116,.30);border-radius:999px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(212,165,116,.55);background-clip:content-box}
  ::-webkit-scrollbar-corner{background:transparent}

  /* Stable shell: never grows "wild" — fixed side rails, the stage scales WITHIN
     its box (container units), everything else scrolls. Works small (DaVinci panel)
     to large. min-0 stops grid blow-ups. */
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-width:760px;overflow:hidden}
  .body{display:grid;grid-template-columns:226px minmax(0,1fr) 290px;min-height:0;min-width:0}
  .lib,.center,.controls{min-width:0;min-height:0}

  /* ---------- top bar ---------- */
  .top{display:flex;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--hair);
    background:linear-gradient(180deg,rgba(20,18,14,.7),rgba(14,13,11,.15))}
  .brand{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .brand .k{color:var(--gold)}
  .pill{font-size:9px;font-weight:700;letter-spacing:.14em;color:#0E0D0B;background:var(--gold);padding:3px 7px;border-radius:999px}
  .linefield{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .linefield .ic{color:var(--faint)}
  .linefield input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:15px;font-family:var(--disp);font-weight:600}
  .seg{display:flex;gap:4px}
  .seg button{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--muted);white-space:nowrap}
  .seg button.on{background:var(--gold);border-color:var(--gold);color:#0E0D0B;font-weight:600}
  .seg button:hover:not(.on){border-color:var(--gold);color:var(--txt)}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;padding:9px 13px;border-radius:9px;white-space:nowrap}
  .btn.gold{background:var(--gold);color:#0E0D0B}.btn.gold:hover{background:var(--gold2)}
  .btn.ghost{border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--gold)}
  .exportwrap{position:relative}
  .exportmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:20;background:var(--elevated);border:1px solid var(--line);border-radius:10px;padding:5px;min-width:220px;box-shadow:0 12px 34px rgba(0,0,0,.55)}
  .exportmenu[hidden]{display:none}
  .exportmenu button{display:block;width:100%;text-align:left;font-size:12.5px;color:var(--txt);padding:8px 10px;border-radius:7px;white-space:nowrap}
  .exportmenu button:hover{background:rgba(212,165,116,.14);color:var(--gold)}

  /* ---------- library ---------- */
  .lib{border-right:1px solid var(--hair);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.012),transparent)}
  .libhead{display:flex;align-items:center;justify-content:space-between}
  .libhead h4{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .libhead button{font-size:11px;color:var(--gold)}
  .vcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--surface);transition:border-color .15s;flex:0 0 auto}
  .vcard:hover{border-color:rgba(235,218,176,.4)}
  .vcard.on{border-color:var(--gold)}
  .vstage{position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(420px 200px at 50% -20%,#1b1610,transparent 70%),var(--bg)}
  .vtitle{font-family:var(--disp);font-weight:700;text-align:center;line-height:1.02;letter-spacing:-.02em;font-size:15px;padding:0 8%}
  .vtitle .tok{display:inline-block;white-space:pre}
  .vmeta{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:11px;color:var(--muted)}
  .vmeta .fav{font-size:13px;color:var(--faint)}.vmeta .fav.on{color:var(--gold)}

  /* ---------- stage ---------- */
  .center{display:grid;grid-template-rows:minmax(0,1fr) auto}
  .stagewrap{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:22px;min-height:0;
    background:radial-gradient(1200px 500px at 50% -10%,#1b1610 0,transparent 60%),
               radial-gradient(900px 600px at 90% 120%,#14120d 0,transparent 55%),var(--bg)}
  .stage{position:relative;container-type:size;aspect-ratio:16/9;
    width:min(100%,calc((100vh - 220px)*16/9));max-width:100%;max-height:100%;
    display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--hair);border-radius:8px}
  .stage[data-aspect="9:16"]{aspect-ratio:9/16;width:min(100%,calc((100vh - 220px)*9/16))}
  .stage[data-aspect="1:1"]{aspect-ratio:1/1;width:min(100%,calc(100vh - 220px))}
  .stage::before{content:"";position:absolute;inset:0;opacity:.6;pointer-events:none;
    background-image:linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%),
                     linear-gradient(45deg,rgba(255,255,255,.018) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.018) 75%);
    background-size:42px 42px;background-position:0 0,21px 21px}
  .alphatag{position:absolute;top:13px;left:15px;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);z-index:2}
  .alphatag b{color:var(--gold)}
  .scene{position:relative;text-align:center;padding:0 6%;max-width:92%}
  .title{font-family:var(--disp);font-weight:700;line-height:1.04;letter-spacing:-.02em;
    font-size:clamp(20px,8.2cqw,108px);color:var(--txt);text-shadow:0 2px 30px rgba(0,0,0,.5)}
  .title .tok{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
  .word{display:inline-block;white-space:nowrap}
  .accent{height:3px;margin:3.2cqh auto 0;width:min(58%,420px);border-radius:3px;transform:scaleX(0);transform-origin:50% 50%;
    background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent)}

  /* ---------- transport + timeline ---------- */
  .transport{display:flex;flex-direction:column;gap:8px;padding:9px 14px 11px;border-top:1px solid var(--hair);
    background:linear-gradient(180deg,rgba(255,255,255,.012),rgba(20,18,14,.5))}
  .tbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .tctrl{display:flex;align-items:center;gap:5px}
  .tbtn{height:30px;min-width:30px;padding:0 7px;border-radius:8px;border:1px solid var(--line);
    display:grid;place-items:center;font-size:12px;color:var(--txt);font-family:var(--mono)}
  .tbtn:hover{border-color:var(--gold);color:var(--gold)}
  .tbtn.on{background:var(--gold);border-color:var(--gold);color:#0E0D0B}
  .tbtn.play{font-size:13px}
  .tsep{width:1px;height:20px;background:var(--hair);margin:0 3px}
  .treadout{display:flex;align-items:center;gap:10px}
  .tc{font-family:var(--mono);font-size:13px;color:var(--txt);font-variant-numeric:tabular-nums}
  .tc small{color:var(--faint)}
  .tframe{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .badge{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap}
  .tset{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-family:var(--mono)}
  .tset select,.tset input{background:var(--elevated);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-family:var(--mono);font-size:11px;padding:4px 6px;width:auto}
  .tset input{width:54px;text-align:right}
  .tl-host{position:relative;height:92px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
  #timeline{position:absolute;inset:0;width:100%;height:100%}

  /* ---------- controls ---------- */
  .controls{border-left:1px solid var(--hair);overflow:auto;background:linear-gradient(180deg,rgba(255,255,255,.012),transparent)}
  .cgroup{border-bottom:1px solid var(--hair);padding:13px 14px}
  .cgroup h4{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;font-weight:600}
  .field{margin-bottom:12px}.field:last-child{margin-bottom:0}
  .field label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field label b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  .seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1;min-width:fit-content}
  select{width:100%;background:var(--elevated);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px}
  input[type=range]{width:100%;accent-color:var(--gold)}
  .swatches{display:flex;gap:7px}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:#fff}
  /* visual pickers */
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .thumb{border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--surface);transition:border-color .12s}
  .thumb:hover{border-color:rgba(235,218,176,.5)}
  .thumb.on{border-color:var(--gold)}
  .thumb .ministage{height:38px;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(200px 70px at 50% -30%,#1b1610,transparent 70%),var(--bg)}
  .thumb .minititle{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
  .thumb .minititle .tok{display:inline-block;white-space:pre}
  .thumb .tlabel{font-size:8.5px;color:var(--muted);text-align:center;padding:3px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thumb.on .tlabel{color:var(--gold)}
  .ethumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .ethumb{border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);padding:4px 3px 2px;transition:border-color .12s}
  .ethumb:hover{border-color:rgba(235,218,176,.5)}
  .ethumb.on{border-color:var(--gold)}
  .ethumb svg{display:block;width:100%;height:24px}
  .ethumb .elabel{font-size:8px;color:var(--muted);text-align:center;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ethumb.on .elabel{color:var(--gold)}
  /* effects stack (schema-driven) */
  .fxadd{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .fxchip{font-size:11px;color:var(--gold);border:1px dashed var(--line);border-radius:7px;padding:4px 8px}
  .fxchip:hover{border-color:var(--gold);background:rgba(212,165,116,.08)}
  .fxcard{border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;background:var(--surface)}
  .fxcard.off{opacity:.5}
  .fxhead{display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .fxtog{font-size:11px;color:var(--gold)}
  .fxname{font-weight:600;font-size:12.5px;flex:1}
  .fxtier{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:1px 5px}
  .fxdel{color:var(--faint);font-size:12px}.fxdel:hover{color:#ff9ec4}
  .fxfield{margin-bottom:8px}.fxfield:last-child{margin-bottom:0}
  .fxfield label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .fxfield label b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
  .fxfield input[type=range]{width:100%;accent-color:var(--gold)}
  .fxsw{display:flex;gap:6px}
  /* font picker */
  .fonthint{font-weight:400;font-size:9.5px;color:var(--faint);text-transform:none;letter-spacing:0}
  .fontpick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px;max-height:148px;overflow-y:auto}
  .fontchip{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;color:var(--txt);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
  .fontchip:hover{border-color:var(--gold)}
  .fontchip.on{border-color:var(--gold);color:var(--gold)}
  .fontchip.missing{color:var(--faint);border-style:dashed;opacity:.55;cursor:not-allowed}
  .fontrow{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .fontrow input{flex:1;min-width:0;background:var(--elevated);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:12.5px;padding:7px 9px}
  .fontfound{font-size:10.5px;white-space:nowrap}
  .fontfound.ok{color:#8fd3a6}.fontfound.no{color:#e0b67a}
  .fontupload{display:block;text-align:center;font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:9px;cursor:pointer}
  .fontupload:hover,.fontupload.drag{border-color:var(--gold);color:var(--gold);background:rgba(212,165,116,.07)}
  .linklike{color:var(--gold);background:none;border:none;font:inherit;font-size:9.5px;cursor:pointer;padding:0;text-decoration:underline}
  .fontaccess{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:8px}
  .fontbtn{font-size:11.5px;color:var(--gold);border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px;background:rgba(212,165,116,.06)}
  .fontbtn:hover{border-color:var(--gold);background:rgba(212,165,116,.14)}
  .famhint{font-size:9.5px;color:var(--faint);flex:1;min-width:100%}
  .famhint.ok{color:#8fd3a6}
  .famhint.warn{color:#e0b67a}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--elevated);
    border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:12.5px;color:var(--txt);
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand"><span class="k">◆</span> Kinetic Typography Studio</span>
    <span class="pill">FREE</span>
    <div class="linefield"><span class="ic">♪</span>
      <input id="line" value="WE OWN THE NIGHT" spellcheck="false" autocomplete="off"></div>
    <div class="seg" id="aspect">
      <button data-v="16:9" class="on">16:9</button><button data-v="9:16">9:16</button><button data-v="1:1">1:1</button>
    </div>
    <button class="btn ghost" id="generate" title="New variants">🎲 Generate</button>
    <div class="exportwrap">
      <button class="btn gold" id="export">⬇ Export</button>
      <div class="exportmenu" id="exportMenu" hidden>
        <button id="expSeq">⬇ PNG sequence (ZIP) · alpha</button>
        <button id="expFrame">⬇ Current frame (PNG)</button>
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="lib">
      <div class="libhead"><h4>Variants</h4><button id="more">＋ more</button></div>
      <div id="cards"></div>
    </aside>

    <section class="center">
      <div class="stagewrap">
        <div class="stage" id="stage" data-aspect="16:9">
          <div class="alphatag">Preview · <b id="lookName">Aurum</b> · transparent</div>
          <div class="scene"><div class="title" id="title"></div><div class="accent" id="accent"></div></div>
        </div>
      </div>
      <footer class="transport">
        <div class="tbar">
          <div class="tctrl">
            <button class="tbtn" id="toStart" title="Start">⏮</button>
            <button class="tbtn" id="framePrev" title="−1 frame (,)">‹</button>
            <button class="tbtn play" id="play" title="Play/Pause (Space)">▶</button>
            <button class="tbtn" id="frameNext" title="+1 frame (.)">›</button>
            <button class="tbtn" id="toEnd" title="End">⏭</button>
            <span class="tsep"></span>
            <button class="tbtn" id="kfPrev" title="Previous keyframe">◆‹</button>
            <button class="tbtn" id="kfNext" title="Next keyframe">›◆</button>
            <button class="tbtn on" id="loop" title="Loop">⟲</button>
            <button class="tbtn" id="lock" title="Lock beats — timing stays when you change style">🔓</button>
          </div>
          <div class="treadout">
            <label class="tset">fps <select id="fps">
              <option>24</option><option>25</option><option selected>30</option><option>50</option><option>60</option></select></label>
            <label class="tset">frames <input id="frames" type="number" min="1" max="36000" step="1" value="87"></label>
            <span class="tc" id="tc">0.00<small>/0.00s</small></span>
            <span class="tframe" id="tframe">f0</span>
            <span class="badge" id="badge">1920×1080 · 30fps · alpha</span>
          </div>
        </div>
        <div class="tl-host"><div id="timeline"></div></div>
      </footer>
    </section>

    <aside class="controls">
      <div class="cgroup"><h4>Animation</h4>
        <div class="field"><label>In <span style="color:var(--faint);font-weight:400">hover = play</span></label><div class="thumbs" id="animInPick"></div></div>
        <div class="field"><label>Out</label><div class="thumbs" id="animOutPick"></div></div>
        <div class="field"><label>Easing</label><div class="ethumbs" id="easePick"></div></div>
      </div>
      <div class="cgroup"><h4>Stagger</h4>
        <div class="field"><label>Unit</label>
          <div class="seg wrap" id="unit"><button data-v="char">Char</button><button data-v="word" class="on">Word</button><button data-v="line">Line</button></div></div>
        <div class="field"><label>Order</label>
          <div class="seg wrap" id="order"><button data-v="l2r" class="on">L→R</button><button data-v="rev">R→L</button><button data-v="center">Center</button><button data-v="random">Random</button></div></div>
        <div class="field"><label>Amount <b id="staggerV">0.60</b></label><input type="range" id="stagger" min="0" max="1" step="0.01" value="0.6"></div>
      </div>
      <div class="cgroup"><h4>Timing</h4>
        <div class="field"><label>In <b id="inV">0.80s</b></label><input type="range" id="inDur" min="0.2" max="2" step="0.05" value="0.8"></div>
        <div class="field"><label>Hold <b id="holdV">1.4s</b></label><input type="range" id="hold" min="0" max="10" step="0.1" value="1.4"></div>
        <div class="field"><label>Out <b id="outV">0.70s</b></label><input type="range" id="outDur" min="0.2" max="2" step="0.05" value="0.7"></div>
      </div>
      <div class="cgroup"><h4>Type</h4>
        <div class="field"><label>Font</label>
          <div class="fontaccess" id="fontAccess"></div>
          <div class="fontpick" id="fontPick"></div>
          <div class="fontrow"><input id="fontName" list="fontList" placeholder="Type a font name…" spellcheck="false" autocomplete="off"><span id="fontFound" class="fontfound"></span></div>
          <datalist id="fontList"></datalist>
          <label class="fontupload" id="fontDrop">⬆ Drop a font file — or click<input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" hidden></label>
        </div>
        <div class="field"><label>Weight <b id="weightV">700</b></label><input type="range" id="weight" min="300" max="800" step="10" value="700"></div>
        <div class="field"><label>Color</label>
          <div class="swatches" id="colors">
            <span class="sw on" style="background:#F4EFE6" data-c="#F4EFE6"></span>
            <span class="sw" style="background:#EBDAB0" data-c="#EBDAB0"></span>
            <span class="sw" style="background:#D4A574" data-c="#D4A574"></span>
            <span class="sw" style="background:#ff9ec4" data-c="#ff9ec4"></span>
            <span class="sw" style="background:#7cd4ff" data-c="#7cd4ff"></span></div></div>
        <div class="field"><label>Accent line <b id="accentV">On</b></label>
          <div class="seg wrap" id="accentToggle"><button data-v="1" class="on">On</button><button data-v="0">Off</button></div></div>
      </div>
      <div class="cgroup"><h4>Effects</h4>
        <div class="fxadd" id="fxAdd"></div>
        <div class="fxstack" id="fxStack"></div>
      </div>
    </aside>
  </div>
</div>

 * Pillar 1 — every frame is a PURE FUNCTION of normalized time t∈[0,1] over an
 *            in→hold→out timeline (the goToTime/seek model Resolve requires).
 * Pillar 2 — sampleFrame() returns pure per-token data; ANY renderer (DOM today,
 *            WebGL/MSDF field later) consumes the same frame shape. No DOM here.
 * Pillar 3 — a Seed encodes the whole look (encodeSeed/decodeSeed) → shareable URL.
 * Pillar 4 — aspect-aware, resolution-independent stage (ASPECTS).
 *
 * No dependencies, no DOM, no globals. Determinism rules: pure f(t), seeded RNG only.
 */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/* ---- easing library (standard formulas — easings.net) ---- */
const EASE = {
  linear:     t => t,
  outCubic:   t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outQuint:   t => 1 - Math.pow(1 - t, 5),
  outExpo:    t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  outBack:    t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => { const c4 = 2 * Math.PI / 3; return t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * c4) + 1; },
  outBounce:  t => { const n = 7.5625, d = 2.75; if (t < 1/d) return n*t*t; if (t < 2/d) return n*(t-=1.5/d)*t+.75; if (t < 2.5/d) return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375; },
};

/* ---- entrance / exit animators: progress p∈[0,1] → partial style (transforms in em) ---- */
const IN = {
  maskRise: p => ({ clip: p, ty: (1 - p) * 0.45 }),
  rise:     p => ({ ty: (1 - p) * 0.85, o: p }),
  fade:     p => ({ o: p }),
  pop:      p => ({ sc: 0.7 + 0.3 * p, o: p }),
  slide:    p => ({ tx: (1 - p) * -1.0, o: p }),
  blurIn:   p => ({ o: p, blur: (1 - p) * 9 }),
};
const OUT = {
  fadeSink: p => ({ o: 1 - p, ty: p * 0.45 }),
  fade:     p => ({ o: 1 - p }),
  riseOut:  p => ({ o: 1 - p, ty: -p * 0.45 }),
  maskDown: p => ({ clip: 1 - p }),
};

/* ---- Effects registry: schema-driven, deterministic, tier-aware ----
   Each effect declares `params` (→ auto-generated controls) and is either:
   - kind:"animator" → frame(tok,i,timeSec,params) mutates token deltas (pure, in-engine)
   - kind:"style"    → style(params) returns CSS for the DOM renderer (Tier A); a future
                       WebGL renderer implements the same id its own way.                */
const EFFECTS = {
  glow: { id: "glow", name: "Glow", tier: "dom", kind: "style",
    params: [ { key: "amount", label: "Amount", type: "range", min: 0, max: 40, step: 1, default: 16, suffix: "px" },
              { key: "color", label: "Color", type: "color", default: "#D4A574" } ],
    style: p => ({ textShadow: `0 0 ${p.amount}px ${p.color}, 0 0 ${p.amount * 2.2}px ${p.color}` }) },
  drift: { id: "drift", name: "Drift", tier: "dom", kind: "animator",
    params: [ { key: "amount", label: "Amount", type: "range", min: 0, max: 0.4, step: 0.01, default: 0.1, suffix: "em" },
              { key: "speed", label: "Speed", type: "range", min: 0.1, max: 3, step: 0.1, default: 0.8 } ],
    frame: (tok, i, ts, p) => { const ph = i * 0.7, w = ts * p.speed * Math.PI * 2;
      tok.ty += Math.sin(w + ph) * p.amount; tok.tx += Math.cos(w * 0.8 + ph) * p.amount * 0.6; } },
  shake: { id: "shake", name: "Shake", tier: "dom", kind: "animator",
    params: [ { key: "amount", label: "Amount", type: "range", min: 0, max: 0.3, step: 0.01, default: 0.07, suffix: "em" },
              { key: "speed", label: "Speed", type: "range", min: 1, max: 30, step: 1, default: 16 } ],
    frame: (tok, i, ts, p) => { const r = n => { const x = Math.sin(ts * p.speed + i * 13.13 + n * 7.7) * 43758.5453; return (x - Math.floor(x)) * 2 - 1; };
      tok.tx += r(1) * p.amount; tok.ty += r(2) * p.amount; } },
};
const EFFECT_LIST = Object.keys(EFFECTS).map(k => ({ id: k, name: EFFECTS[k].name, kind: EFFECTS[k].kind, tier: EFFECTS[k].tier }));

/* compose active animator effects into the frame (deterministic from timeSec) */
function applyAnimators(tokens, effects, timeSec) {
  if (!effects) return;
  for (const fx of effects) {
    if (!fx || !fx.on) continue;
    const def = EFFECTS[fx.id];
    if (!def || def.kind !== "animator" || !def.frame) continue;
    for (let i = 0; i < tokens.length; i++) { const tk = tokens[i]; if (tk.isSpace) continue; def.frame(tk, i, timeSec, fx.params); }
  }
}

/* ---- Pillar 4: resolution-independent stage ---- */
const ASPECTS = { "16:9": [1920, 1080], "9:16": [1080, 1920], "1:1": [1080, 1080] };

const DEFAULT_STATE = {
  line: "WE OWN THE NIGHT",
  unit: "word", order: "l2r",
  animIn: "maskRise", animOut: "fadeSink", ease: "outExpo",
  stagger: 0.6, inDur: 0.8, hold: 1.4, outDur: 0.7,
  weight: 700, color: "#F4EFE6", accent: true, font: "Georgia",
  aspect: "16:9",
};

const duration = s => s.inDur + s.hold + s.outDur;

/* ---- tokenize: line → [{ text, isSpace, animIndex }] (spaces keep layout, not animated) ---- */
function tokenize(line, unit) {
  const text = line && line.length ? line : " ";
  let units;
  if (unit === "char") units = [...text];
  else if (unit === "word") units = text.split(/(\s+)/).filter(s => s.length);
  else units = [text];
  let a = 0;
  return units.map(u => {
    const isSpace = /^\s+$/.test(u);
    return { text: u, isSpace, animIndex: isSpace ? -1 : a++ };
  });
}
const animCount = toks => toks.reduce((n, t) => n + (t.isSpace ? 0 : 1), 0);

/* order → who-goes-first, normalized 0..1 (deterministic, incl. seeded "random") */
function orderNorm(order, i, total) {
  if (total <= 1) return 0;
  const n = i / (total - 1);
  switch (order) {
    case "rev":    return 1 - n;
    case "center": return Math.abs(n - 0.5) * 2;
    case "random": { const s = Math.sin((i + 1) * 12.9898) * 43758.5453; return s - Math.floor(s); }
    default:       return n; // l2r
  }
}

/* =========================================================================
 * THE CORE — pure. state + t∈[0,1] → frame data. No DOM, no side effects.
 * Returns { dur, timeSec, accent, tokens:[{text,isSpace,tx,ty,sc,o,blur,clip}] }
 * ========================================================================= */
function sampleFrame(state, t) {
  const s = state, D = duration(s), timeSec = clamp(t, 0, 1) * D;
  const ease = EASE[s.ease] || EASE.outExpo;
  const inA = IN[s.animIn] || IN.rise, outA = OUT[s.animOut] || OUT.fade;
  const toks = tokenize(s.line, s.unit);
  const N = animCount(toks);
  const stag = s.stagger;
  const tokIn  = Math.max(1e-4, s.inDur  * (1 - 0.82 * stag)), spreadIn  = s.inDur  - tokIn;
  const outStart = s.inDur + s.hold;
  const tokOut = Math.max(1e-4, s.outDur * (1 - 0.82 * stag)), spreadOut = s.outDur - tokOut;

  let entranceSum = 0;
  const tokens = toks.map(tok => {
    if (tok.isSpace) return { text: tok.text, isSpace: true, tx: 0, ty: 0, sc: 1, o: 1, blur: 0, clip: null };
    const on = orderNorm(s.order, tok.animIndex, N);
    const pIn  = ease(clamp((timeSec - on * spreadIn) / tokIn, 0, 1));
    const pOut = ease(clamp((timeSec - outStart - on * spreadOut) / tokOut, 0, 1));
    entranceSum += pIn * (1 - pOut);
    const a = inA(pIn), b = pOut > 0 ? outA(pOut) : null;
    let tx = a.tx || 0, ty = a.ty || 0, sc = a.sc == null ? 1 : a.sc,
        o = a.o == null ? 1 : a.o, blur = a.blur || 0, clip = a.clip == null ? null : a.clip;
    if (b) {
      o *= (b.o == null ? 1 : b.o); ty += b.ty || 0; tx += b.tx || 0;
      sc *= (b.sc == null ? 1 : b.sc); blur += b.blur || 0;
      if (b.clip != null) clip = b.clip;
    }
    return { text: tok.text, isSpace: false, tx, ty, sc, o, blur, clip };
  });

  applyAnimators(tokens, s.effects, timeSec);
  return { dur: D, timeSec, tokens, accent: s.accent ? (N ? entranceSum / N : 0) : 0 };
}

/* ---- Pillar 3: Seed = the whole look ↔ a compact, shareable string ---- */
const SEED_KEYS = ["line","unit","order","animIn","animOut","ease","stagger","inDur","hold","outDur","weight","color","accent","font","aspect"];
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const ub64 = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
function encodeSeed(state) {
  const o = {}; SEED_KEYS.forEach(k => (o[k] = state[k]));
  return "KT1-" + b64u(JSON.stringify(o));
}
function decodeSeed(seed) {
  try {
    const raw = String(seed).startsWith("KT1-") ? String(seed).slice(4) : String(seed);
    return { ...DEFAULT_STATE, ...JSON.parse(ub64(raw)) };
  } catch (_) { return { ...DEFAULT_STATE }; }
}

/* ---- deterministic variant from a number (preview of Phase-1 "surprise me") ---- */
const PALETTE = ["#F4EFE6", "#EBDAB0", "#D4A574", "#ff9ec4", "#7cd4ff"];
const INS = ["maskRise","rise","fade","pop","slide","blurIn"], OUTS = ["fadeSink","fade","riseOut","maskDown"],
      EASES = ["outExpo","outCubic","outQuint","outBack","inOutCubic"], ORDERS = ["l2r","rev","center","random"], UNITS = ["char","word","line"];
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let z = s; z = Math.imul(z ^ z >>> 15, z | 1); z ^= z + Math.imul(z ^ z >>> 7, z | 61); return ((z ^ z >>> 14) >>> 0) / 4294967296; }; }
function variantFromSeed(n, line) {
  const r = rng((n + 1) * 2654435761), pick = a => a[Math.floor(r() * a.length)];
  return {
    ...DEFAULT_STATE, line: line ?? DEFAULT_STATE.line,
    unit: pick(UNITS), order: pick(ORDERS), animIn: pick(INS), animOut: pick(OUTS), ease: pick(EASES),
    stagger: +(0.2 + r() * 0.7).toFixed(2), inDur: +(0.5 + r() * 0.7).toFixed(2),
    hold: +(1 + r() * 1.5).toFixed(1), outDur: +(0.5 + r() * 0.6).toFixed(2),
    weight: 400 + Math.floor(r() * 5) * 100, color: pick(PALETTE), accent: r() > 0.35,
  };
}

/* engine/dom-renderer.mjs — DOM/CSS render target (Tier A: runs in any Resolve OGraf CEF).
 *
 * Consumes the pure frame from sampleFrame(). A future WebGL/MSDF renderer implements
 * the same call shape — render(state, t) — so the engine never changes when the
 * render target does. This is Pillar 2 (one field/frame → many renderers) in practice.
 */


function createDomRenderer(titleEl, accentEl) {
  let signature = "";
  let tokEls = [];

  function ensureTokens(state) {
    const sig = state.line + "|" + state.unit;
    if (sig === signature) return;
    signature = sig;
    titleEl.innerHTML = "";
    tokEls = [];
    let group = null;
    tokenize(state.line, state.unit).forEach(tok => {
      const sp = document.createElement("span");
      sp.className = "tok";
      sp.textContent = tok.text === " " ? " " : tok.text;
      if (tok.isSpace) {
        sp.dataset.space = "1";
        group = null;                 // a space ends the word → line may wrap here (only)
        titleEl.appendChild(sp);
      } else {
        // keep a word's units in one nowrap wrapper so it never breaks mid-word
        if (!group) { group = document.createElement("span"); group.className = "word"; titleEl.appendChild(group); }
        group.appendChild(sp);
      }
      tokEls.push(sp);
    });
  }

  function applyLook(state) {
    titleEl.style.fontFamily = '"' + (state.font || "Georgia") + '", serif';
    titleEl.style.fontWeight = String(state.weight);
    titleEl.style.setProperty("font-variation-settings", `'wght' ${state.weight}`);
    titleEl.style.color = state.color;
  }

  function applyEffects(state) {
    titleEl.style.textShadow = "";                 // reset the style-effect props we own
    const fx = state.effects; if (!fx) return;
    for (const e of fx) {
      if (!e || !e.on) continue;
      const def = EFFECTS[e.id]; if (!def || def.kind !== "style" || !def.style) continue;
      const css = def.style(e.params); for (const k in css) titleEl.style[k] = css[k];
    }
  }

  function render(state, t) {
    ensureTokens(state);
    applyLook(state);
    applyEffects(state);
    const f = sampleFrame(state, t);
    for (let i = 0; i < f.tokens.length; i++) {
      const tk = f.tokens[i], el = tokEls[i];
      if (!el) continue;
      el.style.transform = `translate(${tk.tx}em, ${tk.ty}em) scale(${tk.sc})`;
      el.style.opacity = tk.o;
      el.style.filter = tk.blur > 0.01 ? `blur(${tk.blur}px)` : "";
      el.style.clipPath = tk.clip != null ? `inset(${((1 - tk.clip) * 100).toFixed(2)}% 0 0 0)` : "";
    }
    if (accentEl) accentEl.style.transform = `scaleX(${f.accent.toFixed(4)})`;
    return f;
  }

  return { render, invalidate: () => { signature = ""; tokEls = []; } };
}

/* engine/canvas-renderer.mjs — Canvas2D render target (Tier A: export + offscreen).
 *
 * Same call shape as the DOM renderer — render(state, t) — consuming the pure
 * frame from sampleFrame(). Draws on a TRANSPARENT canvas so frames export as
 * alpha PNGs (the Resolve workflow). This is Pillar 2 in practice: a second
 * renderer, zero engine changes.
 *
 * The canvas's width/height define the output resolution; the title is laid out
 * centered with word-wrap (never splits a word), mirroring the DOM preview.
 */


let FAM = '"Georgia", serif';

function createCanvasRenderer(canvas) {
  const ctx = canvas.getContext("2d");

  /* pick a font size from the output width (mirrors the preview's ~8.2cqw),
     then shrink if the widest word would overflow the safe area */
  function fontSizeFor(frame, W) {
    let px = Math.min(Math.max(W * 0.082, 28), W * 0.12);
    ctx.font = `${700} ${px}px ${FAM}`;
    const maxW = W * 0.86;
    let widest = 0;
    for (const tk of frame.tokens) if (!tk.isSpace) widest = Math.max(widest, ctx.measureText(tk.text).width);
    if (widest > maxW) px *= maxW / widest;
    return px;
  }

  /* group tokens into centered, word-wrapped lines; return per-token centre points */
  function layout(frame, px, W, H, weight) {
    ctx.font = `${weight} ${px}px ${FAM}`;
    const spaceW = ctx.measureText(" ").width;
    const maxW = W * 0.86;
    const measured = frame.tokens.map(tk => ({ tk, w: tk.isSpace ? spaceW : ctx.measureText(tk.text).width }));

    // split into words (runs of non-space) with their following space width
    const words = []; let cur = null;
    for (const m of measured) {
      if (m.tk.isSpace) { if (cur) { cur.after = m.w; cur = null; } }
      else { if (!cur) { cur = { items: [], w: 0, after: 0 }; words.push(cur); } cur.items.push(m); cur.w += m.w; }
    }
    // greedy wrap words into lines
    const lines = []; let line = null;
    for (const wd of words) {
      if (!line || (line.w + (line.items.length ? line.lastAfter : 0) + wd.w) > maxW) { line = { items: [], w: 0, lastAfter: 0 }; lines.push(line); }
      else { line.w += line.lastAfter; line.items.push({ space: true, w: line.lastAfter }); }
      for (const it of wd.items) line.items.push(it);
      line.w += wd.w; line.lastAfter = wd.after;
    }
    // place: vertically centred block, each line centred horizontally
    const lineH = px * 1.12;
    const blockH = lines.length * lineH;
    let y = H / 2 - blockH / 2 + lineH / 2;
    const pos = new Map();
    for (const ln of lines) {
      let x = W / 2 - ln.w / 2;
      for (const it of ln.items) {
        if (!it.space) pos.set(it.tk, { cx: x + it.w / 2, cy: y, w: it.w });
        x += it.w;
      }
      y += lineH;
    }
    return { pos, px };
  }

  /* read active "glow" style effect → canvas shadow (manifest stays the source) */
  function glowOf(state) {
    if (!state.effects) return null;
    for (const e of state.effects) if (e && e.on && e.id === "glow" && EFFECTS.glow) return e.params;
    return null;
  }

  function render(state, t) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);                       // transparent background
    FAM = '"' + (state.font || "Georgia") + '", serif';

    const f = sampleFrame(state, t);
    const px = fontSizeFor(f, W);
    const { pos } = layout(f, px, W, H, state.weight);
    const glow = glowOf(state);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `${state.weight} ${px}px ${FAM}`;
    ctx.fillStyle = state.color;

    for (const tk of f.tokens) {
      if (tk.isSpace) continue;
      const p = pos.get(tk); if (!p) continue;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, tk.o));
      ctx.translate(p.cx + tk.tx * px, p.cy + tk.ty * px);
      ctx.scale(tk.sc, tk.sc);
      if (tk.blur > 0.01) ctx.filter = `blur(${tk.blur}px)`;
      if (glow) { ctx.shadowColor = glow.color; ctx.shadowBlur = glow.amount * 1.6; }
      else { ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = px * 0.28; ctx.shadowOffsetY = px * 0.02; }
      if (tk.clip != null) {                         // mask reveal: show bottom `clip` fraction
        ctx.beginPath();
        ctx.rect(-p.w / 2 - 4, -px / 2 + (1 - tk.clip) * px, p.w + 8, tk.clip * px + 4);
        ctx.clip();
      }
      ctx.fillText(tk.text, 0, 0);
      ctx.restore();
    }

    // accent line
    if (f.accent > 0.001) {
      const aw = Math.min(W * 0.42, 760) * f.accent, ay = H / 2 + (layoutBottom(f, px, H)) + px * 0.5;
      const g = ctx.createLinearGradient(W / 2 - aw / 2, 0, W / 2 + aw / 2, 0);
      g.addColorStop(0, "rgba(212,165,116,0)"); g.addColorStop(0.5, "#EBDAB0"); g.addColorStop(1, "rgba(212,165,116,0)");
      ctx.save(); ctx.globalAlpha = 1; ctx.fillStyle = g;
      ctx.fillRect(W / 2 - aw / 2, ay, aw, Math.max(2, H * 0.0028)); ctx.restore();
    }
    return f;
  }

  // bottom of the text block (for accent placement)
  function layoutBottom(frame, px, H) {
    const lineH = px * 1.12;
    // recompute line count cheaply
    ctx.font = `${700} ${px}px ${FAM}`;
    const maxW = canvas.width * 0.86; let lines = 1, w = 0, spaceW = ctx.measureText(" ").width;
    let cur = 0;
    for (const tk of frame.tokens) {
      if (tk.isSpace) { w += spaceW; continue; }
      const tw = ctx.measureText(tk.text).width;
      if (w + tw > maxW) { lines++; w = tw; } else w += tw;
    }
    return (lines * lineH) / 2;
  }

  return { render };
}

  /* fps + total length (frames) — project settings under the timeline */
  function setTotalFrames(n){ n=clamp(Math.round(+n)||1,1,36000); const tgt=n/fps;
    state.hold=clamp(tgt-state.inDur-state.outDur,0,10); syncControls(); draw(true); }
  $("fps").addEventListener("change",e=>{ fps=+e.target.value; renderStage(); });
  $("frames").addEventListener("change",e=>setTotalFrames(e.target.value));
  $("lock").addEventListener("click",()=>{ lockBeats=!lockBeats; $("lock").classList.toggle("on",lockBeats);
    $("lock").textContent=lockBeats?"🔒":"🔓"; rebuildTimeline();
    toast(lockBeats?"Beats locked · timing stays across style changes":"Beats unlocked"); });

  function renderStage(){
    $("stage").dataset.aspect = state.aspect;
    const f = stageR.render({ ...state, effects: fxStack }, t);
    $("tc").innerHTML = f.timeSec.toFixed(2)+"<small>/"+f.dur.toFixed(2)+"s</small>";
    $("tframe").textContent = "f"+Math.round(f.timeSec*fps);
    $("badge").textContent = ({"16:9":"1920×1080","9:16":"1080×1920","1:1":"1080×1080"}[state.aspect])+" · "+fps+"fps · alpha";
    if(document.activeElement!==$("frames")) $("frames").value = Math.max(1,Math.round(f.dur*fps));
  }
  function draw(rebuild){ if(rebuild) rebuildTimeline(); renderStage(); TL.setTime(t*curDur()*1000); }
  function stop(){ playing=false; cancelAnimationFrame(raf); $("play").textContent="▶"; $("play").classList.remove("on"); }
  function play(){
    if(playing) return stop();
    playing=true; $("play").textContent="❚❚"; $("play").classList.add("on"); if(t>=0.999) t=0; last=performance.now();
    const step=ts=>{ if(!playing)return; t+=(ts-last)/1000/curDur(); last=ts;
      if(t>=1){ if(loop){ t%=1; } else { t=1; renderStage(); TL.setTime(curDur()*1000); return stop(); } }
      renderStage(); TL.setTime(t*curDur()*1000); raf=requestAnimationFrame(step); };
    raf=requestAnimationFrame(step);
  }
  const stepFrame = dir => { stop(); t=clamp(t+dir*(1/fps)/curDur(),0,1); draw(false); };
  function jumpKeyframe(dir){ stop(); const D=curDur(), now=t*D, eps=1e-3, ks=phaseTimes();
    let target = dir>0 ? ks.find(k=>k>now+eps) : [...ks].reverse().find(k=>k<now-eps);
    if(target==null) target = dir>0 ? D : 0; t=clamp(target/D,0,1); draw(false); }

  function buildCards(){
    const host = $("cards"); host.innerHTML="";
    for(let i=0;i<9;i++){
      const k = genBase*9+i, v = variantFromSeed(k, state.line);
      const card = document.createElement("div");
      card.className="vcard"; card.dataset.i=i;
      card.innerHTML = `<div class="vstage"><div class="vtitle"></div></div>
        <div class="vmeta"><span class="vname">Seed ${k}</span>
        <button class="fav ${favorites.has(k)?'on':''}">${favorites.has(k)?'♥':'♡'}</button></div>`;
      const mini = createDomRenderer(card.querySelector(".vtitle"), null); mini.render(v, 0.5);
      let mraf2 = 0;
      card.addEventListener("mouseenter",()=>{ const dur=duration(v), t0=performance.now();
        const loop=ts=>{ mini.render(v, ((ts-t0)/1000/dur)%1); mraf2=requestAnimationFrame(loop); }; mraf2=requestAnimationFrame(loop); });
      card.addEventListener("mouseleave",()=>{ cancelAnimationFrame(mraf2); mini.render(v, 0.5); });
      card.addEventListener("click", e=>{
        if(e.target.closest(".fav")){ favorites.has(k)?favorites.delete(k):favorites.add(k); buildCards(); return; }
        state = lockBeats ? { ...v, inDur:state.inDur, hold:state.hold, outDur:state.outDur } : { ...v };
        syncControls(); draw(true); markActive(i);
      });
      host.appendChild(card);
    }
  }
  function markActive(i){ [...$("cards").children].forEach((c,j)=>c.classList.toggle("on", j===i)); }

  function setSeg(id,v){ [...$(id).children].forEach(b=>b.classList.toggle("on", b.dataset.v===String(v))); }
  function syncControls(){
    markPick("animInPick",state.animIn); markPick("animOutPick",state.animOut); markPick("easePick",state.ease);
    setSeg("unit",state.unit); setSeg("order",state.order); setSeg("aspect",state.aspect);
    setSeg("accentToggle", state.accent?"1":"0"); $("accentV").textContent=state.accent?"On":"Off";
    $("stagger").value=state.stagger; $("staggerV").textContent=(+state.stagger).toFixed(2);
    $("inDur").value=state.inDur;   $("inV").textContent=(+state.inDur).toFixed(2)+"s";
    $("hold").value=state.hold;     $("holdV").textContent=(+state.hold).toFixed(1)+"s";
    $("outDur").value=state.outDur; $("outV").textContent=(+state.outDur).toFixed(2)+"s";
    $("weight").value=state.weight; $("weightV").textContent=state.weight;
    [...$("colors").children].forEach(s=>s.classList.toggle("on", s.dataset.c===state.color));
    markFontActive(state.font); $("fontName").value="";
  }

  let toastT=0;
  function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("show");
    clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }

  function seg(id,cb){ $(id).addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
    [...$(id).children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); cb(b.dataset.v); }); }

  $("line").addEventListener("input",e=>{ state.line=e.target.value; draw(); buildCards(); });
  seg("aspect",v=>{ state.aspect=v; draw(); });
  /* visual pickers — In/Out as motion thumbnails (hover to play), Easing as curves */
  const IN_OPTS=[["maskRise","Mask Rise"],["rise","Rise"],["fade","Fade"],["pop","Pop"],["slide","Slide"],["blurIn","Blur In"]];
  const OUT_OPTS=[["fadeSink","Fade Sink"],["fade","Fade"],["riseOut","Rise"],["maskDown","Mask Down"]];
  const EASE_OPTS=[["outExpo","Expo"],["outCubic","Cubic"],["outQuint","Quint"],["inOutCubic","Smooth"],["outBack","Back"],["outElastic","Elastic"],["outBounce","Bounce"],["linear","Linear"]];
  const SAMPLE="Type";
  const markPick=(hostId,val)=>[...$(hostId).children].forEach(c=>c.classList.toggle("on", c.dataset.v===val));
  function buildAnimPicker(hostId,key,opts,fixed){
    const host=$(hostId); host.innerHTML="";
    opts.forEach(([val,label])=>{
      const cell=document.createElement("div"); cell.className="thumb"; cell.dataset.v=val;
      cell.innerHTML=`<div class="ministage"><div class="minititle"></div></div><div class="tlabel">${label}</div>`;
      const sv={ ...DEFAULT_STATE, line:SAMPLE, unit:"char", stagger:0.7, inDur:0.7, hold:0.3, outDur:0.6, accent:false, ...fixed, [key]:val };
      const r=createDomRenderer(cell.querySelector(".minititle"),null); r.render(sv,0.5);
      let mraf=0;
      cell.addEventListener("mouseenter",()=>{ const dur=duration(sv),t0=performance.now();
        const loop=ts=>{ r.render(sv,((ts-t0)/1000/dur)%1); mraf=requestAnimationFrame(loop); }; mraf=requestAnimationFrame(loop); });
      cell.addEventListener("mouseleave",()=>{ cancelAnimationFrame(mraf); r.render(sv,0.5); });
      cell.addEventListener("click",()=>{ state[key]=val; markPick(hostId,val); draw(); });
      host.appendChild(cell);
    });
  }
  function buildEasePicker(){
    const host=$("easePick"); host.innerHTML=""; const W=60,H=24,pad=3;
    EASE_OPTS.forEach(([val,label])=>{
      const fn=EASE[val]||EASE.outExpo; let d="";
      for(let i=0;i<=22;i++){ const x=i/22,y=fn(x); d+=(i?"L":"M")+(pad+x*(W-2*pad)).toFixed(1)+","+(H-pad-clamp(y,-0.35,1.35)*(H-2*pad)).toFixed(1); }
      const cell=document.createElement("div"); cell.className="ethumb"; cell.dataset.v=val;
      cell.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="rgba(255,255,255,.08)"/><path d="${d}" fill="none" stroke="#D4A574" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="elabel">${label}</div>`;
      cell.addEventListener("click",()=>{ state.ease=val; markPick("easePick",val); draw(); });
      host.appendChild(cell);
    });
  }
  buildAnimPicker("animInPick","animIn",IN_OPTS,{animOut:"fade"});
  buildAnimPicker("animOutPick","animOut",OUT_OPTS,{animIn:"fade"});
  buildEasePicker();
  markPick("animInPick",state.animIn); markPick("animOutPick",state.animOut); markPick("easePick",state.ease);
  seg("unit",v=>{ state.unit=v; draw(); });
  seg("order",v=>{ state.order=v; draw(); });
  seg("accentToggle",v=>{ state.accent=v==="1"; $("accentV").textContent=state.accent?"On":"Off"; draw(); });
  $("stagger").addEventListener("input",e=>{ state.stagger=+e.target.value; $("staggerV").textContent=state.stagger.toFixed(2); draw(); });
  $("inDur").addEventListener("input",e=>{ state.inDur=+e.target.value; $("inV").textContent=state.inDur.toFixed(2)+"s"; draw(true); });
  $("hold").addEventListener("input",e=>{ state.hold=+e.target.value; $("holdV").textContent=state.hold.toFixed(1)+"s"; draw(true); });
  $("outDur").addEventListener("input",e=>{ state.outDur=+e.target.value; $("outV").textContent=state.outDur.toFixed(2)+"s"; draw(true); });
  $("weight").addEventListener("input",e=>{ state.weight=+e.target.value; $("weightV").textContent=state.weight; draw(); });
  $("colors").addEventListener("click",e=>{ const s=e.target.closest(".sw"); if(!s)return;
    [...$("colors").children].forEach(x=>x.classList.remove("on")); s.classList.add("on"); state.color=s.dataset.c; draw(); });
  $("play").addEventListener("click",play);
  $("loop").addEventListener("click",()=>{ loop=!loop; $("loop").classList.toggle("on",loop); });
  $("toStart").addEventListener("click",()=>{ stop(); t=0; draw(false); });
  $("toEnd").addEventListener("click",()=>{ stop(); t=1; draw(false); });
  $("framePrev").addEventListener("click",()=>stepFrame(-1));
  $("frameNext").addEventListener("click",()=>stepFrame(1));
  $("kfPrev").addEventListener("click",()=>jumpKeyframe(-1));
  $("kfNext").addEventListener("click",()=>jumpKeyframe(1));
  $("generate").addEventListener("click",()=>{ genBase=Math.floor(Math.random()*100000)+1; buildCards(); toast("9 new variants · seed base "+genBase); });
  $("more").addEventListener("click",()=>{ genBase++; buildCards(); });
  /* ---------- Export: alpha PNG (frame) + PNG-sequence ZIP (the Resolve workflow) ---------- */
  const EXPORT_RES = { "16:9":[1920,1080], "9:16":[1080,1920], "1:1":[1080,1080] };
  const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
  const crc32 = buf => { let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c=CRC[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  function zipStore(files){                 // minimal store-mode ZIP (no deps); PNGs are already compressed
    const enc=new TextEncoder(), u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
    const parts=[], central=[]; let offset=0;
    for(const f of files){ const name=enc.encode(f.name), data=f.data, crc=crc32(data);
      const lh=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
      parts.push(new Uint8Array(lh),name,data); central.push({name,crc,size:data.length,offset}); offset+=lh.length+name.length+data.length; }
    const cdStart=offset;
    for(const c of central){ const ch=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c.crc),u32(c.size),u32(c.size),u16(c.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.offset));
      parts.push(new Uint8Array(ch),c.name); offset+=ch.length+c.name.length; }
    const cdSize=offset-cdStart;
    parts.push(new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(central.length),u16(central.length),u32(cdSize),u32(cdStart),u16(0))));
    let len=0; for(const p of parts) len+=p.length; const out=new Uint8Array(len); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } return out;
  }
  function download(bytes,name,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([bytes],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }
  function exportFrame(){
    const [w,h]=EXPORT_RES[state.aspect]||[1920,1080]; const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
    createCanvasRenderer(cv).render({ ...state, effects:fxStack }, t);
    cv.toBlob(b=>{ b.arrayBuffer().then(ab=>download(new Uint8Array(ab),"title_f"+String(Math.round(t*duration(state)*fps)).padStart(4,"0")+".png","image/png")); toast("PNG · "+w+"×"+h+" · alpha"); },"image/png");
  }
  async function buildSequenceZip(opts={}){
    const [w,h]=EXPORT_RES[state.aspect]||[1920,1080];
    const total=opts.frames||Math.max(1,Math.min(900,Math.round(duration(state)*fps)));
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; const r=createCanvasRenderer(cv); const files=[];
    for(let i=0;i<total;i++){ const tt=total>1?i/(total-1):0; r.render({ ...state, effects:fxStack }, tt);
      const blob=await new Promise(res=>cv.toBlob(res,"image/png")); files.push({ name:"title_"+String(i).padStart(4,"0")+".png", data:new Uint8Array(await blob.arrayBuffer()) });
      if(opts.onProgress) opts.onProgress((i+1)/total); }
    return { zip:zipStore(files), total, w, h };
  }
  let exporting=false;
  async function exportSequence(){
    if(exporting) return; exporting=true; stop();
    try{ const { zip,total,w,h }=await buildSequenceZip({ onProgress:p=>toast("Exporting sequence… "+Math.round(p*100)+"%") });
      download(zip,"kinetic_title_"+w+"x"+h+"_"+fps+"fps_"+total+"f.zip","application/zip"); toast("ZIP · "+total+" frames · "+w+"×"+h+" · alpha"); }
    catch(e){ toast("Export error: "+e.message); } finally{ exporting=false; }
  }
  $("export").addEventListener("click",e=>{ e.stopPropagation(); $("exportMenu").hidden=!$("exportMenu").hidden; });
  document.addEventListener("click",()=>{ $("exportMenu").hidden=true; });
  $("expSeq").addEventListener("click",()=>{ $("exportMenu").hidden=true; exportSequence(); });
  $("expFrame").addEventListener("click",()=>{ $("exportMenu").hidden=true; exportFrame(); });
  /* QA/export handles */
  window.createCanvasRenderer=createCanvasRenderer; window.__exportState=()=>({ ...state, effects:fxStack }); window.__t=()=>t; window.__buildSequenceZip=buildSequenceZip;
  addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT")return;
    if(e.code==="Space"){ e.preventDefault(); play(); }
    else if(e.key===","){ e.preventDefault(); stepFrame(-1); }
    else if(e.key==="."){ e.preventDefault(); stepFrame(1); } });

  /* ---- Effects: add-chips from the registry + control cards generated from each
     effect's param schema. Proves the "panel adapts to the effect" architecture. ---- */
  const fmtVal=(v,pm)=>(Math.round(v*100)/100)+(pm.suffix?" "+pm.suffix:"");
  function buildFxAdd(){ const host=$("fxAdd"); host.innerHTML="";
    EFFECT_LIST.forEach(e=>{ const b=document.createElement("button"); b.className="fxchip"; b.textContent="＋ "+e.name;
      b.title=e.kind+" · "+e.tier; b.addEventListener("click",()=>addEffect(e.id)); host.appendChild(b); }); }
  function addEffect(id){ const def=EFFECTS[id]; if(!def) return; const params={}; def.params.forEach(p=>params[p.key]=p.default);
    fxStack.push({ id, on:true, params }); renderFxStack(); renderStage(); toast(def.name+" added"); }
  function renderFxStack(){
    const host=$("fxStack"); host.innerHTML="";
    fxStack.forEach((fx,idx)=>{
      const def=EFFECTS[fx.id]; if(!def) return;
      const card=document.createElement("div"); card.className="fxcard"+(fx.on?"":" off");
      const head=document.createElement("div"); head.className="fxhead";
      head.innerHTML=`<button class="fxtog">${fx.on?"●":"○"}</button><span class="fxname">${def.name}</span><span class="fxtier">${def.tier}</span><button class="fxdel">✕</button>`;
      head.querySelector(".fxtog").addEventListener("click",()=>{ fx.on=!fx.on; renderFxStack(); renderStage(); });
      head.querySelector(".fxdel").addEventListener("click",()=>{ fxStack.splice(idx,1); renderFxStack(); renderStage(); });
      card.appendChild(head);
      def.params.forEach(pm=>{
        const f=document.createElement("div"); f.className="fxfield";
        if(pm.type==="range"){
          f.innerHTML=`<label>${pm.label} <b></b></label><input type="range" min="${pm.min}" max="${pm.max}" step="${pm.step}">`;
          const inp=f.querySelector("input"), b=f.querySelector("b"); inp.value=fx.params[pm.key]; b.textContent=fmtVal(fx.params[pm.key],pm);
          inp.addEventListener("input",e=>{ fx.params[pm.key]=+e.target.value; b.textContent=fmtVal(fx.params[pm.key],pm); renderStage(); });
        } else if(pm.type==="color"){
          f.innerHTML=`<label>${pm.label}</label><div class="fxsw"></div>`; const sw=f.querySelector(".fxsw");
          ["#F4EFE6","#EBDAB0","#D4A574","#ff9ec4","#7cd4ff"].forEach(c=>{ const s=document.createElement("span"); s.className="sw"+(c===fx.params[pm.key]?" on":""); s.style.background=c;
            s.addEventListener("click",()=>{ fx.params[pm.key]=c; [...sw.children].forEach(x=>x.classList.remove("on")); s.classList.add("on"); renderStage(); }); sw.appendChild(s); });
        }
        card.appendChild(f);
      });
      host.appendChild(card);
    });
  }
  /* ---------- Fonts: system quick-picks + type-a-name + drag-drop upload (FontFace) ---------- */
  const COMMON_FONTS = [
    "Impact","Anton","Bebas Neue","Oswald","Archivo Black","Futura","Haettenschweiler","Arial Black",
    "Franklin Gothic","Bodoni MT","Didot","Rockwell","Copperplate","Abril Fatface","Bricolage Grotesque",
    "Georgia","Times New Roman","Palatino Linotype","Book Antiqua","Garamond","Baskerville","Cambria","Constantia","Playfair Display",
    "Arial","Helvetica","Helvetica Neue","Segoe UI","Calibri","Candara","Century Gothic","Gill Sans","Optima","Avenir","Avenir Next",
    "Verdana","Trebuchet MS","Tahoma","Inter","Roboto","Montserrat","Poppins","Lato","Open Sans","Space Grotesk",
    "Consolas","Menlo","Monaco","Courier New","Brush Script MT","Pacifico","Lobster","Comic Sans MS",
    "serif","sans-serif","monospace"];
  let uploadedFonts = [], upN = 0, systemFonts = [], fontAccessState = "idle", fontCount = 0;
  const _fc = document.createElement("canvas").getContext("2d");
  function fontAvailable(name){                              // reliable measureText probe
    if(/^(serif|sans-serif|monospace)$/i.test(name)) return true;
    const s="WgEail MOmqQ@10", px="72px";
    const test=base=>{ _fc.font=px+" "+base; const b=_fc.measureText(s).width; _fc.font=px+' "'+name+'", '+base; return _fc.measureText(s).width!==b; };
    return test("monospace")||test("serif")||test("sans-serif");
  }
  function markFontActive(fam){ [...$("fontPick").children].forEach(c=>c.classList.toggle("on", c.dataset.f===fam)); }
  function selectFont(fam){ state.font=fam; markFontActive(fam); draw(); }
  function buildFontPicker(){
    const host=$("fontPick"); host.innerHTML="";
    [...uploadedFonts, ...COMMON_FONTS].forEach(item=>{
      const fam = typeof item==="string"? item : item.fam, label = typeof item==="string"? item : item.label;
      const ok = (typeof item!=="string") || fontAvailable(fam);
      const c=document.createElement("div"); c.className="fontchip"+(ok?"":" missing")+(state.font===fam?" on":"");
      c.dataset.f=fam; c.textContent=label; c.style.fontFamily='"'+fam+'", serif'; c.title=ok?fam:fam+" — not installed";
      if(ok) c.addEventListener("click",()=>selectFont(fam));
      host.appendChild(c);
    });
    renderFontAccess();
  }
  function renderFontAccess(){
    const host=$("fontAccess");
    if(!("queryLocalFonts" in window)){ host.innerHTML='<span class="famhint">Installed fonts cannot be listed here — type the exact name or upload a file.</span>'; return; }
    const hint = fontAccessState==="loaded" ? '<span class="famhint ok">'+fontCount+' system fonts loaded — type to search</span>'
               : fontAccessState==="denied" ? '<span class="famhint warn">Access denied — type the exact name or upload a file (you can try again).</span>'
               : '<span class="famhint">Uses your installed OS fonts.</span>';
    host.innerHTML='<button id="fontBrowse" class="fontbtn">&#9906; Browse installed fonts</button>'+hint;
    $("fontBrowse").onclick=browseFonts;
  }
  async function browseFonts(){                              // Local Font Access API (Chromium/CEF, when available)
    try{ const fonts=await window.queryLocalFonts(); systemFonts=[...new Set(fonts.map(f=>f.family))].sort((a,b)=>a.localeCompare(b));
      $("fontList").innerHTML=systemFonts.map(f=>'<option value="'+f.replace(/"/g,"&quot;")+'">').join("");
      fontAccessState="loaded"; fontCount=systemFonts.length; renderFontAccess(); toast(systemFonts.length+" system fonts loaded"); }
    catch(err){ fontAccessState="denied"; renderFontAccess(); toast("Font access denied — type a name or upload"); }
  }
  $("fontName").addEventListener("input",e=>{ const v=e.target.value.trim(), el=$("fontFound");
    if(!v){ el.textContent=""; el.className="fontfound"; return; }
    const ok=fontAvailable(v); el.textContent=ok?"✓ found":"✗ not installed"; el.className="fontfound "+(ok?"ok":"no"); });
  $("fontName").addEventListener("change",e=>{ const v=e.target.value.trim(); if(v&&fontAvailable(v)){ selectFont(v); buildFontPicker(); } });
  async function loadFontFile(file){
    if(!file) return;
    try{ const buf=await file.arrayBuffer(), fam="KTUser_"+(++upN); const ff=new FontFace(fam, buf); await ff.load(); document.fonts.add(ff);
      uploadedFonts.unshift({ fam, label:(file.name||"Custom").replace(/\.(ttf|otf|woff2?)$/i,"") }); buildFontPicker(); selectFont(fam); toast("Font loaded: "+(file.name||fam)); }
    catch(err){ toast("Couldn't load font: "+err.message); }
  }
  $("fontFile").addEventListener("change",e=>loadFontFile(e.target.files[0]));
  ["dragover","dragenter"].forEach(ev=>$("fontDrop").addEventListener(ev,e=>{ e.preventDefault(); $("fontDrop").classList.add("drag"); }));
  ["dragleave","dragend"].forEach(ev=>$("fontDrop").addEventListener(ev,e=>{ e.preventDefault(); $("fontDrop").classList.remove("drag"); }));
  $("fontDrop").addEventListener("drop",e=>{ e.preventDefault(); $("fontDrop").classList.remove("drag"); const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) loadFontFile(f); });

  function init(){ buildFontPicker(); buildFxAdd(); buildCards(); draw(true); window.__ready=true; }
  document.fonts&&document.fonts.ready ? document.fonts.ready.then(init) : init();
</script>
