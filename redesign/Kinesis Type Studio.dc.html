            </label>

          </div>

      <div style="padding:15px 16px;border-bottom:1px solid #2E2A23"><div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8A8174;font-weight:600;margin-bottom:13px">Typeface</div><div ref="{{ typeRef }}"></div></div>
      <div style="padding:15px 16px;border-bottom:1px solid #2E2A23"><div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8A8174;font-weight:600;margin-bottom:13px">Background</div><div ref="{{ bgPanelRef }}"></div></div>
      <div style="padding:15px 16px"><div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8A8174;font-weight:600;margin-bottom:13px">Finish</div><div ref="{{ finishRef }}"></div></div>
    </aside>

  </div>

</div>

<script type="text/x-dc" data-dc-script>

  componentDidMount(){this.K=window.KTE;if(!this.K){this._boot=setTimeout(()=>this.componentDidMount(),30);return;}this.boot();}
  componentWillUnmount(){this.mounted=false;cancelAnimationFrame(this.raf);clearTimeout(this._boot);if(this._kd)document.removeEventListener("keydown",this._kd);if(this._docClick)document.removeEventListener("click",this._docClick);if(this._rz)window.removeEventListener("resize",this._rz);}

  /* ---- tiny DOM helper ---- */
  h(tag,p,kids){const e=document.createElement(tag);if(p)for(const k in p){const v=p[k];if(v==null)continue;if(k==="style")Object.assign(e.style,v);else if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.slice(0,2)==="on"&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);else e.setAttribute(k,v);}if(kids!=null)for(const c of [].concat(kids)){if(c==null)continue;e.appendChild(typeof c==="object"?c:document.createTextNode(String(c)));}return e;}
  sub(text){return this.h("div",{style:{fontSize:"10px",letterSpacing:".14em",textTransform:"uppercase",color:this.C.faint,fontWeight:"600",fontFamily:"'JetBrains Mono',monospace",margin:"2px 0 9px"}},text);}

  boot(){
    this.mounted=true;this.refreshers=[];this._kfControls=[];this._kfMarks=[];
    this.C={paper:"#16140F",panel:"#1E1B15",ink:"#ECE7DC",muted:"#A39A8B",faint:"#8A8174",rule:"#2E2A23",accent:"#D24226",kfOn:"#E8B04B",stageBg:"#0E0D0A"};
    this.IC={skipStart:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="2.4" height="14" rx="1"/><path d="M20 5L9 12l11 7z"/></svg>',skipEnd:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="17.6" y="5" width="2.4" height="14" rx="1"/><path d="M4 5l11 7L4 19z"/></svg>',prev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',next:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',play:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>',pause:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',loop:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3.5 3.5L17 9"/><path d="M3.5 11.5V10A4.5 4.5 0 0 1 8 5.5h12.5"/><path d="M7 22l-3.5-3.5L7 15"/><path d="M20.5 12.5V14a4.5 4.5 0 0 1-4.5 4.5H3.5"/></svg>',lockOpen:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-1.9"/></svg>',lockClosed:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'};
    this.IN_OPTS=[["maskRise","Mask Rise"],["rise","Rise"],["fade","Fade"],["pop","Pop"],["slide","Slide"],["blurIn","Blur In"]];

  markActiveCards(){const host=this.gridRef.current;if(!host)return;[...host.children].forEach(c=>{if(c.__id)c.style.borderColor=(c.__id===this.activeKey)?this.C.accent:this.C.rule;});}
  rebuildGrid(){const host=this.gridRef.current;if(!host)return;host.innerHTML="";const C=this.C;
    if(this.filter==="fav"){this.moreRef.current.style.display="none";
      if(!this.favorites.length){host.appendChild(this.h("div",{style:{padding:"26px 8px",textAlign:"center",lineHeight:"1.6"}},[this.h("div",{style:{fontFamily:"'Instrument Serif',serif",fontStyle:"italic",fontSize:"19px",color:C.muted,marginBottom:"7px"}},"Nothing saved yet"),this.h("div",{style:{fontSize:"11.5px",color:C.faint}},"Heart a variant — or hit Save look — to keep it here.")]));return;}
      this.favorites.forEach(item=>host.appendChild(this.makeSavedCard(item)));return;}
    for(let i=0;i<9;i++){const k=this.genBase*9+i;host.appendChild(this.makeVariantCard(k));}this.moreRef.current.style.display="block";}

  /* ---- export ---- */
  exportRes(){const b=this.S.aspect==="9:16"?[1080,1920]:this.S.aspect==="1:1"?[1080,1080]:[1920,1080];const sc=this.exportScale||1;return [Math.round(b[0]*sc),Math.round(b[1]*sc)];}
  download(bytes,name,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
  setupImport(){const C=this.C;this._fileInput=this.h("input",{type:"file",accept:".kinesis,.json,application/json",style:{display:"none"}});this._fileInput.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)this.importLibraryFile(f);e.target.value="";});this.rootRef.current.appendChild(this._fileInput);
    const aside=this.gridRef.current.parentElement;const hi=()=>{aside.style.outline="1px dashed "+C.accent;aside.style.outlineOffset="-6px";},lo=()=>{aside.style.outline="none";};
    ["dragover","dragenter"].forEach(ev=>aside.addEventListener(ev,e=>{e.preventDefault();hi();}));
    aside.addEventListener("dragleave",e=>{if(!aside.contains(e.relatedTarget))lo();});
    aside.addEventListener("drop",e=>{e.preventDefault();lo();const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)this.importLibraryFile(f);});}
  exportLibrary(){const data={app:"kinesis",v:1,exported:new Date().toISOString(),favorites:this.favorites};const bytes=new TextEncoder().encode(JSON.stringify(data,null,2));this.download(bytes,"kinesis-library.kinesis","application/json");this.toast(this.favorites.length+" look"+(this.favorites.length===1?"":"s")+" exported");}
  async importLibraryFile(file){if(!file)return;try{const txt=await file.text();const data=JSON.parse(txt);const incoming=Array.isArray(data)?data:(data&&data.favorites);if(!Array.isArray(incoming))throw 0;let added=0;incoming.forEach(it=>{if(it&&it.id&&it.state&&!this.favorites.some(f=>f.id===it.id)){this.favorites.push(it);added++;}});this.persistFavs();this.filter="fav";this.updateFilterCount();this.rebuildGrid();this.toast(added?("Imported "+added+" look"+(added>1?"s":"")):"Library already up to date");}catch(_){this.toast("Couldn't read that file");}}
  buildExportMenu(){const m=this.exportMenuRef.current;m.innerHTML="";m.style.display="none";const C=this.C;
    const item=(label,fn)=>{const b=this.h("button",{style:{display:"block",width:"100%",textAlign:"left",fontSize:"12.5px",color:C.ink,padding:"8px 10px",borderRadius:"6px",whiteSpace:"nowrap"}},label);b.addEventListener("mouseenter",()=>b.style.background="rgba(236,231,220,.06)");b.addEventListener("mouseleave",()=>b.style.background="transparent");b.addEventListener("click",()=>{m.style.display="none";fn();});return b;};
    m.appendChild(item("Current frame · PNG (alpha)",()=>this.exportFrame()));
    m.appendChild(item("PNG sequence · ZIP (alpha)",()=>this.exportSequence()));
    m.appendChild(this.h("div",{style:{height:"1px",background:C.rule,margin:"4px 6px"}}));
    m.appendChild(item("Copy share code",()=>{const code=this.K.encodeSeed(this.S);try{navigator.clipboard.writeText(code);this.toast("Share code copied");}catch(_){this.toast(code.slice(0,24)+"…");}}));
    m.appendChild(this.h("div",{style:{height:"1px",background:C.rule,margin:"4px 6px"}}));
    m.appendChild(item("Export library (.kinesis)",()=>this.exportLibrary()));
    m.appendChild(item("Import library…",()=>this._fileInput&&this._fileInput.click()));}
  exportFrame(){const r=this.exportRes(),w=r[0],h=r[1];const cv=document.createElement("canvas");cv.width=w;cv.height=h;this.K.createCanvasRenderer(cv).render(this.effectiveState(this.S,this.t),this.t);cv.toBlob(b=>{b.arrayBuffer().then(ab=>this.download(new Uint8Array(ab),"kinesis_f"+String(Math.round(this.t*this.K.duration(this.S)*this.fps)).padStart(4,"0")+".png","image/png"));this.toast("PNG · "+w+"×"+h);},"image/png");}
  async exportSequence(){if(this._exporting)return;this._exporting=true;this.stopPlay();try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;const r=this.exportRes(),w=r[0],h=r[1];const total=Math.max(1,Math.min(900,Math.round(this.K.duration(this.S)*this.fps)));const cv=document.createElement("canvas");cv.width=w;cv.height=h;const rend=this.K.createCanvasRenderer(cv);const files=[];for(let i=0;i<total;i++){const tt=total>1?i/(total-1):0;rend.render(this.effectiveState(this.S,tt),tt);const blob=await new Promise(res=>cv.toBlob(res,"image/png"));files.push({name:"kinesis_"+String(i).padStart(4,"0")+".png",data:new Uint8Array(await blob.arrayBuffer())});if(i%8===0)this.toast("Exporting… "+Math.round((i+1)/total*100)+"%");}const zip=this.K.zipStore(files);this.download(zip,"kinesis_"+w+"x"+h+"_"+this.fps+"fps_"+total+"f.zip","application/zip");this.toast("ZIP · "+total+" frames · "+w+"×"+h);}catch(e){this.toast("Export error");}finally{this._exporting=false;}}

  toast(msg){const el=this.toastRef.current;if(!el)return;el.textContent=msg;el.style.opacity="1";clearTimeout(this._tt);this._tt=setTimeout(()=>el.style.opacity="0",2400);}

  /* ---- property keyframes (global tracks) ---- */
  effectiveState(state,t){const tr=state.tracks;if(!tr)return state;const keys=Object.keys(tr).filter(k=>tr[k]&&tr[k].length);if(!keys.length)return state;const eff={...state};keys.forEach(p=>{const v=this.sampleProp(tr[p],t,p);if(v!=null)eff[p]=v;});eff.tracks=undefined;return eff;}
  sampleProp(kfs,t,prop){if(!kfs||!kfs.length)return null;const arr=kfs;if(arr.length===1)return arr[0].v;if(t<=arr[0].t)return arr[0].v;if(t>=arr[arr.length-1].t)return arr[arr.length-1].v;let i=0;while(i<arr.length-1&&arr[i+1].t<t)i++;const a=arr[i],b=arr[i+1],span=(b.t-a.t)||1;let u=(t-a.t)/span;u=u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;return prop==="color"?this.lerpColor(a.v,b.v,u):(a.v+(b.v-a.v)*u);}
  _hex(c){c=(c||"").replace("#","");if(c.length===3)c=c.split("").map(x=>x+x).join("");return[parseInt(c.slice(0,2),16)||0,parseInt(c.slice(2,4),16)||0,parseInt(c.slice(4,6),16)||0];}
  lerpColor(c1,c2,u){const a=this._hex(c1),b=this._hex(c2),h=n=>{n=Math.max(0,Math.min(255,Math.round(n)));return(n<16?"0":"")+n.toString(16);};return "#"+h(a[0]+(b[0]-a[0])*u)+h(a[1]+(b[1]-a[1])*u)+h(a[2]+(b[2]-a[2])*u);}
  isKeyed(prop){return !!(this.S.tracks&&this.S.tracks[prop]&&this.S.tracks[prop].length);}
  keyAtTime(prop,t){const arr=this.S.tracks&&this.S.tracks[prop];if(!arr||!arr.length)return false;for(const k of arr)if(Math.abs(k.t-t)<=0.015)return true;return false;}
  gotoKey(prop,dir){const arr=this.S.tracks&&this.S.tracks[prop];if(!arr||!arr.length)return;this.stopPlay();const t=this.t;let target=null;if(dir<0){for(const k of arr){if(k.t<t-0.001&&(target===null||k.t>target))target=k.t;}}else{for(const k of arr){if(k.t>t+0.001&&(target===null||k.t<target))target=k.t;}}if(target===null)return;this.t=this.K.clamp(target,0,1);this.renderStage();}
  upsertKey(prop,t,v){if(!this.S.tracks)this.S.tracks={};const arr=this.S.tracks[prop]||(this.S.tracks[prop]=[]);const ex=arr.find(k=>Math.abs(k.t-t)<0.012);if(ex)ex.v=v;else arr.push({t,v});arr.sort((a,b)=>a.t-b.t);}
  removeKey(prop,kf){const arr=this.S.tracks&&this.S.tracks[prop];if(!arr)return;const i=arr.indexOf(kf);if(i>=0)arr.splice(i,1);if(!arr.length&&this.S.tracks)delete this.S.tracks[prop];this.refreshAll();}
  toggleTrack(prop,curVal){if(this.isKeyed(prop)){if(this.S.tracks)delete this.S.tracks[prop];}else{if(!this.S.tracks)this.S.tracks={};this.S.tracks[prop]=[{t:this.t,v:curVal}];}}
  rebuildLanes(){const C=this.C,cont=this._lanes;if(!cont)return;cont.innerHTML="";cont.style.position="relative";const tr=this.S.tracks||{};const props=Object.keys(tr).filter(p=>tr[p]&&tr[p].length);const META={weight:"Weight",fontScale:"Size",letterSpacing:"Tracking",color:"Color",accentLen:"Accent"};cont.style.marginTop=props.length?"8px":"0";
    props.forEach(p=>{const lane=this.h("div",{title:"Double-click empty area to add a keyframe",style:{position:"relative",height:"21px",borderTop:"1px solid "+C.rule}});
      lane.appendChild(this.h("div",{style:{position:"absolute",left:"3px",top:"5px",fontSize:"8px",fontFamily:"'JetBrains Mono',monospace",letterSpacing:".1em",textTransform:"uppercase",color:C.faint,pointerEvents:"none",zIndex:"1"}},META[p]||p));
      lane.addEventListener("dblclick",e=>{if(e.target!==lane)return;const r=lane.getBoundingClientRect();const t=this.K.clamp((e.clientX-r.left)/r.width,0,1);this.upsertKey(p,t,this.sampleProp(tr[p],t,p));this.persist();this.rebuildLanes();this.requestRender();});
      tr[p].forEach(kf=>{const dia=this.h("div",{title:(META[p]||p)+" · drag to move · double-click to delete",style:{position:"absolute",top:"50%",left:(kf.t*100)+"%",width:"9px",height:"9px",marginTop:"-5px",marginLeft:"-5px",background:C.accent,border:"1.5px solid "+C.paper,transform:"rotate(45deg)",cursor:"ew-resize",zIndex:"2"}});
        dia.addEventListener("pointerdown",e=>{e.stopPropagation();dia.setPointerCapture(e.pointerId);this._laneDrag={p,kf};});
        dia.addEventListener("pointermove",e=>{if(!this._laneDrag||this._laneDrag.kf!==kf)return;const r=lane.getBoundingClientRect();kf.t=this.K.clamp((e.clientX-r.left)/r.width,0,1);dia.style.left=(kf.t*100)+"%";this.requestRender();});
        dia.addEventListener("pointerup",e=>{if(this._laneDrag){this._laneDrag=null;tr[p].sort((a,b)=>a.t-b.t);this.persist();this.requestRender();}try{dia.releasePointerCapture(e.pointerId);}catch(_){}});
        dia.addEventListener("dblclick",e=>{e.stopPropagation();this.removeKey(p,kf);this.persist();this.rebuildLanes();this.requestRender();});
        lane.appendChild(dia);});
      cont.appendChild(lane);});
    if(props.length){this._lanesPh=this.h("div",{style:{position:"absolute",top:"0",bottom:"0",width:"0",borderLeft:"1px solid "+C.accent,opacity:".55",pointerEvents:"none",left:(this.t*100)+"%"}});cont.appendChild(this._lanesPh);}else this._lanesPh=null;}

  setupCollapsible(){const C=this.C;const secs=[["Motion",this.motionRef],["Timing",this.timingRef],["Rhythm",this.rhythmRef],["Compose",this.composeRef],["Typeface",this.typeRef],["Background",this.bgPanelRef],["Finish",this.finishRef]];
    let collapsed={};try{collapsed=JSON.parse(localStorage.getItem("kts:collapsed"))||{};}catch(_){}
    secs.forEach(pair=>{const name=pair[0],host=pair[1].current;if(!host)return;const section=host.parentElement,label=section.firstElementChild;
      Object.assign(label.style,{display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",userSelect:"none",transition:"color .15s"});
      const chev=this.h("span",{html:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',style:{display:"inline-flex",color:C.faint,transition:"transform .22s ease",transformOrigin:"50% 50%"}});
      label.appendChild(chev);
      const apply=(on,animate)=>{if(on){host.style.display="none";chev.style.transform="rotate(-90deg)";label.style.marginBottom="0";}else{host.style.display="";chev.style.transform="rotate(0deg)";label.style.marginBottom="13px";if(animate&&host.animate)host.animate([{opacity:0,transform:"translateY(-4px)"},{opacity:1,transform:"none"}],{duration:190,easing:"ease"});}};
      label.addEventListener("click",()=>{collapsed[name]=!collapsed[name];apply(collapsed[name],true);try{localStorage.setItem("kts:collapsed",JSON.stringify(collapsed));}catch(_){}});
      label.addEventListener("mouseenter",()=>label.style.color=C.muted);
      label.addEventListener("mouseleave",()=>label.style.color=C.faint);
      apply(!!collapsed[name],false);});}
}
</script>
